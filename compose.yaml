services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  app:
    build: patton2510/els-crm:latest
    container_name: crm-app
    ports:
      - "8082:8080"      # Maps the app to localhost:8080 on your PC
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Saves uploaded receipts/photos to your real hard drive so they aren't lost
      - ./uploads:/app/uploads
    depends_on:
      - postgres         # Makes sure the database starts BEFORE the app
    restart: always

volumes:
  postgres-data: