services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  app:
    build: .             # This tells Docker to look for the Dockerfile we just made
    container_name: crm-app
    ports:
      - "8080:8080"      # Maps the app to localhost:8080 on your PC
    environment:
      # CRITICAL: We changed 'localhost' to 'postgres' here so it finds the DB inside the Docker network!
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Saves uploaded receipts/photos to your real hard drive so they aren't lost
      - ./uploads:/app/uploads
    depends_on:
      - postgres         # Makes sure the database starts BEFORE the app
    restart: always

volumes:
  postgres-data: