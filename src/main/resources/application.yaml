spring:
  application:
    name: crmsystem

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-file-size: 50MB       # Default is 1MB. Increased for Videos/High-Res Photos.
      max-request-size: 60MB    # Total size if uploading multiple files at once.

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

# Custom ELS Configuration
els:
  upload-dir: uploads # create an 'uploads' folder in project root

security:
  remember-me:
    key: ${COOKIE_SECRET}

# ADD THIS AT THE VERY BOTTOM:
server:
  servlet:
    session:
      timeout: 24h

logging:
  file:
    name: logs/els-crm.log
  logback:
    rollingpolicy:
      max-file-size: 10MB  # When it hits 10MB, it archives it and starts a new file
      max-history: 30      # Keeps 30 days of history, deletes the rest automatically
  level:
    root: INFO
    com.els.crmsystem: INFO  # Shows standard info for your app. Change to DEBUG if you need deep troubleshooting.