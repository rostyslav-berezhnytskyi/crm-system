<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Контакти')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
        <h2 class="mb-0 text-center text-sm-start">📇 Довідник контактів</h2>

        <div class="w-100 d-flex flex-column flex-sm-row justify-content-sm-end gap-2" style="max-width: 450px;">

            <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''DIRECTOR'')')}"
               th:href="@{/contacts/export(name=${currentName}, role=${currentRole})}"
               class="btn btn-success text-nowrap w-100 w-sm-auto shadow-sm">
                <i class="bi bi-file-earmark-excel me-1"></i> Експорт
            </a>

            <a href="/companies" class="btn btn-outline-secondary text-nowrap w-100 w-sm-auto shadow-sm">🏢 Компанії</a>
            <a href="/contacts/new" class="btn btn-primary text-nowrap w-100 w-sm-auto shadow-sm">
                <i class="bi bi-person-plus me-1"></i> Додати контакт
            </a>
        </div>
    </div>

    <div th:replace="~{fragments :: filterAccordion(~{::#contactFilterForm})}">
        <div id="contactFilterForm">
            <form method="get" action="/contacts" class="row g-2 align-items-end">

                <input type="hidden" name="sortField" th:value="${sortField}">
                <input type="hidden" name="sortDir" th:value="${sortDir}">

                <div class="col-12 col-md-5">
                    <label class="form-label text-muted small fw-bold mb-1">Пошук за ім'ям</label>
                    <input type="text" name="name" class="form-control form-control-sm" placeholder="Введіть ім'я..." th:value="${currentName}" autocomplete="off">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label text-muted small fw-bold mb-1">Роль контакту</label>
                    <select name="role" class="form-select form-select-sm search-select"> <option value="">Всі ролі</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.ukrainianName}" th:selected="${r == currentRole}"></option>
                    </select>
                </div>

                <div class="col-12 col-md-3 d-flex gap-2 mt-3 mt-md-auto">
                    <button type="submit" class="btn btn-sm btn-primary w-100 fw-bold py-2 py-md-1"><i class="bi bi-search me-1"></i> Знайти</button>
                    <a href="/contacts" class="btn btn-sm btn-outline-secondary w-100 py-2 py-md-1">Скинути</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0 d-none d-md-block" style="border-radius: 12px;">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0" style="table-layout: fixed; width: 100%;">
                <thead class="table-light">
                <tr>
                    <th style="width: 20%;" class="ps-4">
                        <a class="text-dark text-decoration-none d-flex align-items-center"
                           th:href="@{/contacts(sortField='name', sortDir=${sortField == 'name' and sortDir == 'asc' ? 'desc' : 'asc'}, name=${currentName}, role=${currentRole})}">
                            Ім'я <i class="bi ms-1" th:classappend="${sortField == 'name'} ? (${sortDir == 'desc'} ? 'bi-sort-down' : 'bi-sort-up') : 'bi-arrow-down-up text-muted opacity-25'"></i>
                        </a>
                    </th>
                    <th style="width: 20%;">Роль / Компанія</th>
                    <th style="width: 25%;">Контактні дані</th>
                    <th>Нотатки</th>
                    <th style="width: 120px;" class="text-center pe-4">Дії</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="contact : ${contacts}" class="clickable-row" th:data-href="@{/contacts/{id}(id=${contact.id()})}">
                    <td class="ps-4 text-truncate">
                        <strong class="text-dark fs-6 d-block text-truncate" th:text="${contact.name()}" th:title="${contact.name()}"></strong>
                    </td>

                    <td class="text-truncate">
                        <span class="badge bg-primary bg-opacity-10 text-primary mb-1" th:text="${contact.role().getUkrainianName()}"></span>
                        <div class="text-muted small text-truncate" th:title="${contact.companyName()}" th:text="${contact.companyName() != null ? contact.companyName() : '- Незалежний -'}"></div>
                    </td>

                    <td class="text-truncate">
                        <div class="small text-dark text-truncate mb-1"><i class="bi bi-telephone text-muted me-1"></i> <span th:text="${contact.phone()}"></span></div>
                        <div class="small text-dark text-truncate"><i class="bi bi-envelope text-muted me-1"></i> <span th:text="${contact.email()}"></span></div>
                    </td>

                    <td class="text-muted small text-truncate" th:title="${contact.notes()}" th:text="${contact.notes()}"></td>

                    <td class="text-center pe-4">
                        <div class="btn-group shadow-sm position-relative" style="z-index: 2;">
                            <a th:href="@{/contacts/edit/{id}(id=${contact.id()})}" class="btn btn-sm btn-outline-warning border-0" title="Редагувати"><i class="bi bi-pencil-square fs-5"></i></a>
                            <form th:action="@{/contacts/delete/{id}(id=${contact.id()})}" method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цей контакт?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="Видалити"><i class="bi bi-trash fs-5"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contacts)}">
                    <td colspan="5" class="text-center py-4 text-muted">Контактів не знайдено.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-md-none d-flex justify-content-center mb-4">
        <div class="w-100 px-2" style="max-width: 450px;">

            <div th:each="contact : ${contacts}" class="card shadow-sm border-0 mb-3 clickable-row" style="border-radius: 16px;" th:data-href="@{/contacts/{id}(id=${contact.id()})}">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <strong class="fs-5 text-dark d-block text-truncate pe-2" th:text="${contact.name()}"></strong>
                        <span class="badge bg-primary bg-opacity-10 text-primary mt-1 text-nowrap" th:text="${contact.role().getUkrainianName()}"></span>
                    </div>

                    <div class="bg-light p-2 rounded mb-3 small">
                        <div class="text-muted text-truncate mb-2">
                            <i class="bi bi-buildings me-1"></i> <span class="text-dark fw-bold" th:text="${contact.companyName() != null ? contact.companyName() : '- Незалежний -'}"></span>
                        </div>
                        <div class="text-muted text-truncate mb-1">
                            <i class="bi bi-telephone me-1"></i> <span class="text-dark" th:text="${contact.phone()}"></span>
                        </div>
                        <div class="text-muted text-truncate">
                            <i class="bi bi-envelope me-1"></i> <span class="text-dark" th:text="${contact.email()}"></span>
                        </div>
                    </div>

                    <div class="text-muted small text-truncate mb-2" th:if="${contact.notes() != null and !contact.notes().isEmpty()}" th:text="${contact.notes()}"></div>

                    <div class="d-flex justify-content-end border-top pt-2 mt-2">
                        <div class="btn-group position-relative" style="z-index: 2;">
                            <a th:href="@{/contacts/edit/{id}(id=${contact.id()})}" class="btn btn-sm btn-outline-warning border-0"><i class="bi bi-pencil-square fs-5"></i></a>
                            <form th:action="@{/contacts/delete/{id}(id=${contact.id()})}" method="post" onsubmit="return confirm('Видалити цей контакт?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger border-0"><i class="bi bi-trash fs-5"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(contacts)}" class="text-center py-4 text-muted">Контактів не знайдено.</div>
        </div>
    </div>

    <nav aria-label="Page navigation" th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/contacts(page=${currentPage - 1}, sortField=${sortField}, sortDir=${sortDir}, name=${currentName}, role=${currentRole})}">Попередня</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                <a class="page-link" th:href="@{/contacts(page=${i}, sortField=${sortField}, sortDir=${sortDir}, name=${currentName}, role=${currentRole})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/contacts(page=${currentPage + 1}, sortField=${sortField}, sortDir=${sortDir}, name=${currentName}, role=${currentRole})}">Наступна</a>
            </li>
        </ul>
    </nav>

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const rows = document.querySelectorAll(".clickable-row");
        rows.forEach(row => {
            row.addEventListener("click", function(e) {
                if(e.target.closest('button') || e.target.closest('a') || e.target.closest('form')) {
                    return;
                }
                window.location.href = this.getAttribute("data-href");
            });
        });
    });
</script>

<div th:replace="~{fragments :: scripts}"></div>

</body>
</html>
