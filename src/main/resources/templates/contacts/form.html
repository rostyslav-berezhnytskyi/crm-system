<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Форма контакту')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">

                <div class="card-header text-white py-3" th:classappend="${contactId == null ? 'bg-primary' : 'bg-warning'}">
                    <h5 class="mb-0" th:classappend="${contactId != null ? 'text-dark' : ''}">
                        <i th:class="${contactId == null ? 'bi bi-person-plus-fill me-2' : 'bi bi-pencil-square me-2'}"></i>
                        <span th:text="${contactId == null ? 'Створити новий контакт' : 'Редагувати контакт'}"></span>
                    </h5>
                </div>

                <div class="card-body p-4">
                    <form th:action="${contactId == null ? '/contacts' : '/contacts/edit/' + contactId}"
                          th:object="${contact}" method="post">

                        <div class="row mb-3 gy-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold text-muted small">Ім'я контакту *</label>
                                <input type="text" class="form-control" th:field="*{name}" placeholder="ПІБ або Назва" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold text-muted small">Роль *</label>
                                <select class="form-select" th:field="*{role}" required>
                                    <option th:each="r : ${roles}"
                                            th:value="${r}"
                                            th:text="${r.getUkrainianName()}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4 p-3 bg-white border rounded shadow-sm">
                            <label class="form-label fw-bold text-muted small"><i class="bi bi-buildings me-1"></i> Компанія <span class="text-secondary fw-normal">(Необов'язково)</span></label>
                            <select class="form-select" th:field="*{companyId}">
                                <option value="">-- Без компанії (Незалежний) --</option>
                                <option th:each="comp : ${companies}"
                                        th:value="${comp.id()}"
                                        th:text="${comp.name()}"></option>
                            </select>
                        </div>

                        <div class="row mb-4 gy-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold text-muted small"><i class="bi bi-telephone me-1"></i> Номер телефону</label>
                                <input type="text" class="form-control" th:field="*{phone}" placeholder="+380...">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold text-muted small"><i class="bi bi-envelope me-1"></i> Електронна пошта</label>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="email@example.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small">Нотатки</label>
                            <textarea class="form-control" th:field="*{notes}" rows="3" placeholder="Спеціальні вимоги, вподобання щодо спілкування..."></textarea>
                        </div>

                        <div class="d-flex flex-column flex-sm-row justify-content-between mt-5 gap-3">
                            <a href="/contacts" class="btn btn-secondary px-4 w-100 w-sm-auto shadow-sm">Скасувати</a>

                            <button type="submit" class="btn px-5 fw-bold w-100 w-sm-auto shadow-sm" th:classappend="${contactId == null ? 'btn-primary' : 'btn-warning'}">
                                Зберегти контакт
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
