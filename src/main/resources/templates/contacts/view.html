<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Профіль контакту')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
            <div class="card shadow-sm border-0" style="border-radius: 12px;">

                <div class="card-header bg-dark text-white d-flex flex-column flex-sm-row justify-content-between align-items-sm-center py-3 gap-3">
                    <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i> Профіль контакту</h5>
                    <div class="d-grid d-sm-block">
                        <a href="/contacts" class="btn btn-sm btn-outline-light text-nowrap w-100 w-sm-auto shadow-sm">Повернутися до списку</a>
                    </div>
                </div>

                <div class="card-body p-4 p-md-5">

                    <div class="d-flex flex-column flex-md-row align-items-md-center mb-4 gap-2">
                        <h2 class="fw-bold mb-0 text-dark" th:text="${contact.name()}"></h2>
                        <div>
                            <span class="badge bg-primary bg-opacity-10 text-primary fs-6 border border-primary-subtle" th:text="${contact.role().getUkrainianName()}"></span>
                        </div>
                    </div>

                    <div class="bg-white border rounded p-3 p-md-4 shadow-sm mb-4">
                        <div class="row gy-3 align-items-center">
                            <div class="col-12 col-sm-4 text-muted fw-bold small"><i class="bi bi-building me-1"></i> Компанія:</div>
                            <div class="col-12 col-sm-8">
                                <a th:if="${contact.companyId() != null}" th:href="@{/companies/{id}(id=${contact.companyId()})}" class="fw-bold text-decoration-none fs-6" th:text="${contact.companyName()}"></a>
                                <span th:if="${contact.companyId() == null}" class="text-muted">- Незалежний -</span>
                            </div>

                            <div class="col-12"><hr class="m-0 text-muted opacity-25"></div>

                            <div class="col-12 col-sm-4 text-muted fw-bold small"><i class="bi bi-telephone me-1"></i> Телефон:</div>
                            <div class="col-12 col-sm-8 text-dark fw-bold" th:text="${contact.phone() != null and !contact.phone().isEmpty() ? contact.phone() : '—'}"></div>

                            <div class="col-12"><hr class="m-0 text-muted opacity-25"></div>

                            <div class="col-12 col-sm-4 text-muted fw-bold small"><i class="bi bi-envelope me-1"></i> Email:</div>
                            <div class="col-12 col-sm-8 text-dark text-break" th:text="${contact.email() != null and !contact.email().isEmpty() ? contact.email() : '—'}"></div>
                        </div>
                    </div>

                    <th:block th:if="${not #lists.isEmpty(transactions)}">

                        <div class="card shadow-sm border-0 mb-4" style="border-radius: 12px; background: linear-gradient(to right, #ffffff, #f8f9fa);">
                            <div class="card-body p-4">
                                <h6 class="fw-bold text-muted mb-4"><i class="bi bi-pie-chart-fill me-2"></i>Фінансова аналітика контрагента</h6>

                                <div class="row text-center mb-4 g-2">
                                    <div class="col-4 border-end px-1">
                                        <div class="text-muted small fw-bold text-uppercase mb-1" style="font-size: 0.65rem;">Дохід</div>
                                        <h6 class="text-success mb-0 fw-bold text-nowrap">+ <span th:text="${#numbers.formatDecimal(totalIncome, 1, 'WHITESPACE', 2, 'POINT')}"></span> ₴</h6>
                                    </div>
                                    <div class="col-4 border-end px-1">
                                        <div class="text-muted small fw-bold text-uppercase mb-1" style="font-size: 0.65rem;">Витрати</div>
                                        <h6 class="text-danger mb-0 fw-bold text-nowrap">- <span th:text="${#numbers.formatDecimal(totalExpense, 1, 'WHITESPACE', 2, 'POINT')}"></span> ₴</h6>
                                    </div>
                                    <div class="col-4 px-1">
                                        <div class="text-muted small fw-bold text-uppercase mb-1" style="font-size: 0.65rem;">Баланс</div>
                                        <h6 class="mb-0 fw-bold text-nowrap" th:classappend="${totalBalance >= 0 ? 'text-success' : 'text-danger'}">
                                            <span th:text="${totalBalance > 0 ? '+' : ''}"></span><span th:text="${#numbers.formatDecimal(totalBalance, 1, 'WHITESPACE', 2, 'POINT')}"></span> ₴
                                        </h6>
                                    </div>
                                </div>

                                <th:block th:if="${not #maps.isEmpty(expenseBreakdown)}">
                                    <h6 class="fw-bold text-dark border-bottom pb-2 mb-3 fs-6 mt-2">Деталізація сплат</h6>
                                    <div class="row gy-2">
                                        <div class="col-12 col-sm-6 col-md-4 d-flex justify-content-between align-items-center small" th:each="entry : ${expenseBreakdown}">
                                            <span class="text-secondary">
                                                <i class="bi bi-circle-fill me-2 text-warning" style="font-size: 0.5rem;"></i>
                                                <span th:text="${entry.key.getUkrainianName()}"></span>
                                            </span>
                                            <strong class="text-dark bg-white border px-2 py-1 rounded text-nowrap" th:text="${#numbers.formatDecimal(entry.value, 1, 'WHITESPACE', 2, 'POINT')} + ' ₴'"></strong>
                                        </div>
                                    </div>
                                </th:block>
                            </div>
                        </div>

                        <div class="card shadow-sm border-0 mb-4" style="border-radius: 12px;">
                            <div class="card-header bg-dark text-white fw-bold py-3 d-flex justify-content-between align-items-center">
                                <span>💰 Історія платежів</span>
                            </div>
                            <div class="card-body p-0 table-responsive">
                                <table class="table table-hover table-sm mb-0 align-middle bg-white">
                                    <thead class="table-light">
                                    <tr>
                                        <th class="ps-3 py-2" style="width: 15%;">Дата</th>
                                        <th class="py-2" style="width: 25%;">Проєкт</th>
                                        <th class="py-2">Опис та Категорія</th>
                                        <th class="text-end py-2" style="width: 15%;">Сума</th>
                                        <th class="text-center pe-3 py-2" style="width: 110px;">Дії</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="txn : ${transactions}">
                                        <td class="text-muted small ps-3">
                                            <div th:text="${#temporals.format(txn.date(), 'dd-MM-yy')}"></div>
                                            <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle" style="font-size: 0.65rem;" th:text="${txn.paymentMethod().getUkrainianName()}"></span>
                                        </td>
                                        <td class="text-truncate">
                                            <strong class="text-dark small" th:text="${txn.projectName()}"></strong>
                                        </td>
                                        <td>
                                            <span class="badge bg-info bg-opacity-10 text-info border border-info-subtle mb-1" style="font-size: 0.65rem;" th:text="${txn.category().getUkrainianName()}"></span>
                                            <div class="text-muted small" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" th:title="${txn.description()}" th:text="${txn.description()}"></div>
                                        </td>
                                        <td class="text-end fw-bold text-nowrap" th:classappend="${txn.type().name() == 'INCOME'} ? 'text-success' : 'text-danger'">
                                            <span th:text="${txn.type().name() == 'EXPENSE'} ? '-' : '+'"></span>
                                            <span th:text="${txn.amount()}"></span> ₴
                                        </td>
                                        <td class="text-center pe-3">
                                            <div class="btn-group">
                                                <a th:if="${txn.receiptUrl() != null}" th:href="@{'/uploads/' + ${txn.receiptUrl()}}" target="_blank" class="btn btn-sm btn-outline-secondary border-0" title="Чек"><i class="bi bi-receipt"></i></a>
                                                <a th:if="${txn.itemImageUrl() != null}" th:href="@{'/uploads/' + ${txn.itemImageUrl()}}" target="_blank" class="btn btn-sm btn-outline-info border-0" title="Фото"><i class="bi bi-camera"></i></a>
                                                <a th:href="@{/transactions/edit/{id}(id=${txn.id()})}" class="btn btn-sm btn-outline-warning border-0" title="Редагувати / Деталі"><i class="bi bi-pencil-square"></i></a>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </th:block>

                    <div class="p-3 p-md-4 bg-light rounded border mb-5">
                        <h6 class="fw-bold text-muted border-bottom pb-2 mb-3"><i class="bi bi-journal-text me-1"></i> Нотатки</h6>
                        <p class="mb-0 text-dark" style="white-space: pre-wrap; word-wrap: break-word;" th:text="${contact.notes() != null and !contact.notes().isEmpty() ? contact.notes() : 'Нотатки відсутні.'}"></p>
                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-end gap-3 pt-3 border-top">
                        <a th:href="@{/contacts/edit/{id}(id=${contact.id()})}" class="btn btn-warning px-4 fw-bold w-100 w-sm-auto shadow-sm">
                            <i class="bi bi-pencil-square me-1"></i> Редагувати
                        </a>
                        <form th:action="@{/contacts/delete/{id}(id=${contact.id()})}" method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цей контакт?');" class="w-100 w-sm-auto">
                            <button type="submit" class="btn btn-danger px-4 fw-bold w-100 shadow-sm">
                                <i class="bi bi-trash me-1"></i> Видалити
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
