<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Профіль компанії')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
            <div class="card shadow-sm border-0" style="border-radius: 12px;">

                <div class="card-header bg-dark text-white d-flex flex-column flex-sm-row justify-content-between align-items-sm-center py-3 gap-3">
                    <h5 class="mb-0"><i class="bi bi-building me-2"></i> Профіль компанії</h5>
                    <div class="d-grid d-sm-block">
                        <a href="/companies" class="btn btn-sm btn-outline-light text-nowrap w-100 w-sm-auto shadow-sm">Повернутися до списку</a>
                    </div>
                </div>

                <div class="card-body p-4 p-md-5">

                    <h2 class="fw-bold mb-4 text-dark" th:text="${company.name()}"></h2>

                    <div class="bg-white border rounded p-3 p-md-4 shadow-sm mb-4">
                        <div class="row gy-3 align-items-center">

                            <div class="col-12 col-sm-4 text-muted fw-bold small"><i class="bi bi-telephone me-1"></i> Телефон:</div>
                            <div class="col-12 col-sm-8 text-dark fw-bold" th:text="${company.mainPhone() != null and !company.mainPhone().isEmpty() ? company.mainPhone() : '—'}"></div>

                            <div class="col-12"><hr class="m-0 text-muted opacity-25"></div>

                            <div class="col-12 col-sm-4 text-muted fw-bold small"><i class="bi bi-envelope me-1"></i> Email:</div>
                            <div class="col-12 col-sm-8 text-dark text-break" th:text="${company.email() != null and !company.email().isEmpty() ? company.email() : '—'}"></div>

                            <div class="col-12"><hr class="m-0 text-muted opacity-25"></div>

                            <div class="col-12 col-sm-4 text-muted fw-bold small"><i class="bi bi-globe me-1"></i> Вебсайт:</div>
                            <div class="col-12 col-sm-8 text-break">
                                <a th:if="${company.website() != null and !company.website().isEmpty()}" th:href="${company.website()}" target="_blank" class="fw-bold text-decoration-none fs-6" th:text="${company.website()}"></a>
                                <span th:if="${company.website() == null or company.website().isEmpty()}" class="text-muted">—</span>
                            </div>

                        </div>
                    </div>

                    <div class="p-3 p-md-4 bg-light rounded border mb-5">
                        <h6 class="fw-bold text-muted border-bottom pb-2 mb-3"><i class="bi bi-journal-text me-1"></i> Нотатки</h6>
                        <p class="mb-0 text-dark" style="white-space: pre-wrap; word-wrap: break-word;" th:text="${company.notes() != null and !company.notes().isEmpty() ? company.notes() : 'Нотатки відсутні.'}"></p>
                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-end gap-3 pt-3 border-top">
                        <a th:href="@{/companies/edit/{id}(id=${company.id()})}" class="btn btn-warning px-4 fw-bold w-100 w-sm-auto shadow-sm">
                            <i class="bi bi-pencil-square me-1"></i> Редагувати
                        </a>
                        <form th:action="@{/companies/delete/{id}(id=${company.id()})}" method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цю компанію?');" class="w-100 w-sm-auto">
                            <button type="submit" class="btn btn-danger px-4 fw-bold w-100 shadow-sm">
                                <i class="bi bi-trash me-1"></i> Видалити
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
