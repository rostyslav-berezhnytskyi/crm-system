<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Профіль компанії')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
            <div class="card shadow-sm border-0" style="border-radius: 12px;">

                <div class="card-header bg-dark text-white d-flex flex-column flex-sm-row justify-content-between align-items-sm-center py-3 gap-3">
                    <h5 class="mb-0"><i class="bi bi-building me-2"></i> Профіль компанії</h5>
                    <div class="d-grid d-sm-block">
                        <a href="/companies" class="btn btn-sm btn-outline-light text-nowrap w-100 w-sm-auto shadow-sm">Повернутися до списку</a>
                    </div>
                </div>

                <div class="card-body p-4 p-md-5">

                    <div class="d-flex align-items-center flex-wrap gap-2 mb-4">
                        <h2 class="fw-bold mb-0 text-dark" th:text="${company.name()}"></h2>
                        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle fs-6" th:text="${company.role().getUkrainianName()}"></span>
                    </div>

                    <div class="bg-white border rounded p-3 p-md-4 shadow-sm mb-4">
                        <div class="row gy-3 align-items-center">

                            <div class="col-12 col-sm-4 text-muted fw-bold small"><i class="bi bi-telephone me-1"></i> Телефон:</div>
                            <div class="col-12 col-sm-8 text-dark fw-bold" th:text="${company.mainPhone() != null and !company.mainPhone().isEmpty() ? company.mainPhone() : '—'}"></div>

                            <div class="col-12"><hr class="m-0 text-muted opacity-25"></div>

                            <div class="col-12 col-sm-4 text-muted fw-bold small"><i class="bi bi-envelope me-1"></i> Email:</div>
                            <div class="col-12 col-sm-8 text-dark text-break" th:text="${company.email() != null and !company.email().isEmpty() ? company.email() : '—'}"></div>

                            <div class="col-12"><hr class="m-0 text-muted opacity-25"></div>

                            <div class="col-12 col-sm-4 text-muted fw-bold small"><i class="bi bi-globe me-1"></i> Вебсайт:</div>
                            <div class="col-12 col-sm-8 text-break">
                                <a th:if="${company.website() != null and !company.website().isEmpty()}" th:href="${company.website()}" target="_blank" class="fw-bold text-decoration-none fs-6" th:text="${company.website()}"></a>
                                <span th:if="${company.website() == null or company.website().isEmpty()}" class="text-muted">—</span>
                            </div>

                        </div>
                    </div>

                    <div class="p-3 p-md-4 bg-light rounded border mb-5">
                        <h6 class="fw-bold text-muted border-bottom pb-2 mb-3"><i class="bi bi-journal-text me-1"></i> Нотатки</h6>
                        <p class="mb-0 text-dark" style="white-space: pre-wrap; word-wrap: break-word;" th:text="${company.notes() != null and !company.notes().isEmpty() ? company.notes() : 'Нотатки відсутні.'}"></p>
                    </div>

                        <div class="card shadow-sm border-0 mb-4 bg-light">
                            <div class="card-header bg-dark text-white fw-bold py-3 d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-people me-1"></i> Контактні особи</span>

                                <a th:href="@{/contacts/new(companyId=${company.id})}" class="btn btn-sm btn-primary fw-bold shadow-sm">
                                    <i class="bi bi-person-plus me-1"></i> Додати
                                </a>
                            </div>

                            <div class="card-body p-0 bg-white">
                                <ul class="list-group list-group-flush">
                                    <li th:each="contact : ${company.contacts}" class="list-group-item d-flex justify-content-between align-items-center p-3">
                                        <div>
                                            <a th:href="@{/contacts/{id}(id=${contact.id})}" class="fw-bold text-dark text-decoration-none d-block mb-1 fs-6" th:text="${contact.name}"></a>

                                            <span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle me-2" th:text="${contact.role.ukrainianName}"></span>
                                            <span class="text-muted small" th:if="${contact.phone != null and !contact.phone.isEmpty()}">
                                            <i class="bi bi-telephone me-1"></i><span th:text="${contact.phone}"></span>
                                        </span>
                                        </div>

                                        <div class="d-flex align-items-center">
                                            <a th:if="${contact.phone != null and !contact.phone.isEmpty()}" th:href="'tel:' + ${contact.phone}" class="btn btn-sm btn-light border rounded-circle shadow-sm" title="Зателефонувати">
                                                <i class="bi bi-telephone-fill text-success"></i>
                                            </a>
                                        </div>
                                    </li>

                                    <li th:if="${#lists.isEmpty(company.contacts)}" class="list-group-item text-center text-muted py-4 bg-light">
                                        До цієї компанії ще не прив'язано жодного співробітника.
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <div class="card-header bg-dark text-white fw-bold py-3">
                            <i class="bi bi-folder me-1"></i> Офіційні документи та Реквізити
                        </div>
                        <div class="card-body p-4 bg-white">

                            <form th:action="@{/companies/{id}/documents(id=${company.id()})}" method="post" enctype="multipart/form-data" class="bg-light p-3 rounded border shadow-sm mb-4">
                                <div class="row g-2 align-items-center">
                                    <div class="col-12 col-md-5">
                                        <input type="file" name="files" class="form-control" accept="image/*,.pdf,.xls,.xlsx,.doc,.docx" multiple required>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <input type="text" name="description" class="form-control" placeholder="Опис (напр. Виписка)">
                                    </div>
                                    <div class="col-12 col-md-3 mt-2 mt-md-0">
                                        <button type="submit" class="btn btn-success w-100 fw-bold"><i class="bi bi-upload me-1"></i> Завантажити</button>
                                    </div>
                                </div>
                            </form>

                            <div th:if="${#lists.isEmpty(documents)}" class="text-center text-muted py-4 rounded border border-dashed">
                                <p class="mb-0">Документи відсутні.</p>
                            </div>

                            <div class="list-group shadow-sm" style="max-height: 400px; overflow-y: auto;">
                                <div th:each="doc : ${documents}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
                                    <div class="d-flex align-items-center overflow-hidden w-100 pe-3">

                                        <a th:href="@{'/uploads/' + ${doc.fileUrl()}}" target="_blank" class="flex-shrink-0 text-decoration-none">
                                            <img th:if="${doc.fileType() != null and #strings.startsWith(doc.fileType(), 'image/')}"
                                                 th:src="@{'/uploads/' + ${doc.fileUrl()}}"
                                                 class="rounded shadow-sm me-3 border"
                                                 style="width: 50px; height: 50px; object-fit: cover;" alt="Preview">

                                            <div th:unless="${doc.fileType() != null and #strings.startsWith(doc.fileType(), 'image/')}"
                                                 class="bg-light rounded shadow-sm border me-3 d-flex align-items-center justify-content-center"
                                                 style="width: 50px; height: 50px;">
                                                <i class="bi bi-filetype-pdf text-danger fs-4" th:if="${doc.fileType() != null and #strings.contains(doc.fileType(), 'pdf')}"></i>
                                                <i class="bi bi-file-earmark-text text-primary fs-4" th:unless="${doc.fileType() != null and #strings.contains(doc.fileType(), 'pdf')}"></i>
                                            </div>
                                        </a>

                                        <div class="text-truncate">
                                            <span class="fw-bold text-dark d-block text-truncate mb-1" th:text="${doc.description() != null and !doc.description().isEmpty() ? doc.description() : 'Документ'}"></span>
                                            <small class="text-muted"><i class="bi bi-clock me-1"></i><span th:text="${#temporals.format(doc.uploadedAt(), 'dd-MM-yy')}"></span></small>
                                        </div>
                                    </div>

                                    <div class="d-flex flex-shrink-0">
                                        <form th:action="@{/companies/documents/{docId}/delete(docId=${doc.id()})}" method="post" onsubmit="return confirm('Видалити цей документ?');">
                                            <input type="hidden" name="companyId" th:value="${company.id()}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger border-0 rounded-circle" title="Видалити"><i class="bi bi-trash fs-5"></i></button>
                                        </form>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-end gap-3 pt-3 border-top">
                        <a th:href="@{/companies/edit/{id}(id=${company.id()})}" class="btn btn-warning px-4 fw-bold w-100 w-sm-auto shadow-sm">
                            <i class="bi bi-pencil-square me-1"></i> Редагувати
                        </a>
                        <form th:action="@{/companies/delete/{id}(id=${company.id()})}" method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цю компанію?');" class="w-100 w-sm-auto">
                            <button type="submit" class="btn btn-danger px-4 fw-bold w-100 shadow-sm">
                                <i class="bi bi-trash me-1"></i> Видалити
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
