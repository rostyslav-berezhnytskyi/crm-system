<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ELS CRM - Профіль компанії</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>body { background-color: #f4f6f9; }</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/">ELS CRM</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/projects">Проєкти</a></li>
                <li class="nav-item"><a class="nav-link" href="/transactions">Транзакції</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacts">Контакти</a></li>
                <li class="nav-item"><a class="nav-link active" href="/companies">Компанії</a></li>
                <li class="nav-item"><a class="nav-link" href="/users">Співробітники</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">🏢 Профіль компанії</h5>
                    <a href="/companies" class="btn btn-sm btn-outline-light">Повернутися до списку</a>
                </div>
                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4" th:text="${company.name()}"></h2>

                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted fw-bold">Телефон:</div>
                        <div class="col-sm-8"><i class="bi bi-telephone text-primary"></i> <span th:text="${company.mainPhone() != null and !company.mainPhone().isEmpty() ? company.mainPhone() : '—'}"></span></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted fw-bold">Електронна пошта:</div>
                        <div class="col-sm-8"><i class="bi bi-envelope text-primary"></i> <span th:text="${company.email() != null and !company.email().isEmpty() ? company.email() : '—'}"></span></div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-sm-4 text-muted fw-bold">Вебсайт:</div>
                        <div class="col-sm-8">
                            <i class="bi bi-globe text-primary"></i>
                            <a th:if="${company.website() != null and !company.website().isEmpty()}" th:href="${company.website()}" target="_blank" th:text="${company.website()}"></a>
                            <span th:if="${company.website() == null or company.website().isEmpty()}">—</span>
                        </div>
                    </div>

                    <div class="p-3 bg-light rounded border mb-4">
                        <h6 class="fw-bold text-muted border-bottom pb-2">📝 Нотатки</h6>
                        <p class="mb-0" style="white-space: pre-wrap;" th:text="${company.notes() != null and !company.notes().isEmpty() ? company.notes() : 'Нотатки відсутні.'}"></p>
                    </div>

                    <div class="d-flex justify-content-end border-top pt-3">
                        <a th:href="@{/companies/edit/{id}(id=${company.id()})}" class="btn btn-warning me-2"><i class="bi bi-pencil"></i> Редагувати</a>
                        <form th:action="@{/companies/delete/{id}(id=${company.id()})}" method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цю компанію?');">
                            <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Видалити</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
