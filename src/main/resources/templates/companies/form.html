<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Форма компанії')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0" style="border-radius: 12px;">

                <div class="card-header text-white py-3" th:classappend="${companyId == null ? 'bg-primary' : 'bg-warning'}">
                    <h5 class="mb-0" th:classappend="${companyId != null ? 'text-dark fw-bold' : ''}">
                        <i th:class="${companyId == null ? 'bi bi-building-add me-2' : 'bi bi-pencil-square me-2'}"></i>
                        <span th:text="${companyId == null ? 'Створити нову компанію' : 'Редагувати компанію'}"></span>
                    </h5>
                </div>

                <div class="card-body p-4">
                    <form th:action="${companyId == null ? '/companies' : '/companies/edit/' + companyId}"
                          th:object="${company}" method="post">

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small"><i class="bi bi-building me-1"></i> Назва компанії *</label>
                            <input type="text" class="form-control form-control-lg" th:field="*{name}" placeholder="Наприклад: ТОВ ЕнергоЛайф" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="row mb-4 gy-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold text-muted small"><i class="bi bi-telephone me-1"></i> Номер телефону</label>
                                <input type="text" class="form-control" th:field="*{mainPhone}" placeholder="+380...">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold text-muted small"><i class="bi bi-envelope me-1"></i> Електронна пошта</label>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="email@company.com">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small"><i class="bi bi-globe me-1"></i> Вебсайт</label>
                            <input type="text" class="form-control" th:field="*{website}" placeholder="https://...">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small"><i class="bi bi-journal-text me-1"></i> Нотатки</label>
                            <textarea class="form-control" th:field="*{notes}" rows="3" placeholder="Додаткова інформація про партнера, знижки, умови доставки..."></textarea>
                        </div>

                        <div class="d-flex flex-column flex-sm-row justify-content-between mt-5 gap-3">
                            <a href="/companies" class="btn btn-secondary px-4 w-100 w-sm-auto shadow-sm">Скасувати</a>

                            <button type="submit" class="btn px-5 fw-bold w-100 w-sm-auto shadow-sm" th:classappend="${companyId == null ? 'btn-primary' : 'btn-warning'}">
                                <span th:text="${companyId == null ? 'Зберегти компанію' : 'Оновити компанію'}"></span>
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
