<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ELS CRM - Форма компанії</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>body { background-color: #f4f6f9; }</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/">ELS CRM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/projects">Проєкти</a></li>
                <li class="nav-item"><a class="nav-link" href="/transactions">Транзакції</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacts">Контакти</a></li>
                <li class="nav-item"><a class="nav-link active" href="/companies">Компанії</a></li>
                <li class="nav-item"><a class="nav-link" href="/users">Співробітники</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Вийти
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${companyId == null ? 'Створити нову компанію' : 'Редагувати компанію'}"></h5>
                </div>
                <div class="card-body">
                    <form th:action="${companyId == null ? '/companies' : '/companies/edit/' + companyId}"
                          th:object="${company}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Назва компанії *</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Номер телефону</label>
                                <input type="text" class="form-control" th:field="*{mainPhone}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Електронна пошта</label>
                                <input type="email" class="form-control" th:field="*{email}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Вебсайт</label>
                            <input type="text" class="form-control" th:field="*{website}" placeholder="https://...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Нотатки</label>
                            <textarea class="form-control" th:field="*{notes}" rows="3" placeholder="Додаткова інформація про партнера..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end">
                            <a href="/companies" class="btn btn-secondary me-2">Скасувати</a>
                            <button type="submit" class="btn btn-success">Зберегти компанію</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
