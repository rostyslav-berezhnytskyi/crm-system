<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Компанії')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
        <h2 class="mb-0 text-center text-sm-start">🏢 Довідник компаній</h2>

        <div class="w-100 d-flex flex-column flex-sm-row justify-content-sm-end gap-2" style="max-width: 450px;">
            <a href="/contacts" class="btn btn-outline-secondary text-nowrap w-100 w-sm-auto shadow-sm">📇 Контакти</a>
            <a href="/companies/new" class="btn btn-primary text-nowrap w-100 w-sm-auto shadow-sm">
                <i class="bi bi-building-add me-1"></i> Додати компанію
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0 d-none d-md-block" style="border-radius: 12px;">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0" style="table-layout: fixed; width: 100%;">
                <thead class="table-light">
                <tr>
                    <th style="width: 25%;" class="ps-4">Назва компанії</th>
                    <th style="width: 25%;">Контактні дані</th>
                    <th>Нотатки</th>
                    <th style="width: 120px;" class="text-center pe-4">Дії</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="company : ${companies}" class="clickable-row" th:data-href="@{/companies/{id}(id=${company.id()})}">
                    <td class="ps-4 text-truncate">
                        <strong class="text-dark fs-6 d-block text-truncate" th:text="${company.name()}" th:title="${company.name()}"></strong>
                    </td>

                    <td class="text-truncate">
                        <div class="small text-dark text-truncate mb-1" th:title="${company.mainPhone()}">
                            <i class="bi bi-telephone text-muted me-1"></i> <span th:text="${company.mainPhone() != null and !company.mainPhone().isEmpty() ? company.mainPhone() : '—'}"></span>
                        </div>
                        <div class="small text-dark text-truncate mb-1" th:title="${company.email()}">
                            <i class="bi bi-envelope text-muted me-1"></i> <span th:text="${company.email() != null and !company.email().isEmpty() ? company.email() : '—'}"></span>
                        </div>
                        <div class="small text-dark text-truncate" th:title="${company.website()}">
                            <i class="bi bi-globe text-muted me-1"></i> <span th:text="${company.website() != null and !company.website().isEmpty() ? company.website() : '—'}"></span>
                        </div>
                    </td>

                    <td class="text-muted small text-truncate" th:title="${company.notes()}" th:text="${company.notes()}"></td>

                    <td class="text-center pe-4">
                        <div class="btn-group shadow-sm position-relative" style="z-index: 2;">
                            <a th:href="@{/companies/edit/{id}(id=${company.id()})}" class="btn btn-sm btn-outline-warning border-0" title="Редагувати"><i class="bi bi-pencil-square fs-5"></i></a>
                            <form th:action="@{/companies/delete/{id}(id=${company.id()})}" method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цю компанію?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="Видалити"><i class="bi bi-trash fs-5"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(companies)}">
                    <td colspan="4" class="text-center py-4 text-muted">Компаній не знайдено.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-md-none d-flex justify-content-center mb-4">
        <div class="w-100 px-2" style="max-width: 450px;">

            <div th:each="company : ${companies}" class="card shadow-sm border-0 mb-3 clickable-row" style="border-radius: 16px;" th:data-href="@{/companies/{id}(id=${company.id()})}">
                <div class="card-body p-3">
                    <strong class="fs-5 text-dark d-block text-truncate mb-3" th:text="${company.name()}"></strong>

                    <div class="bg-light p-2 rounded mb-3 small">
                        <div class="text-muted text-truncate mb-2">
                            <i class="bi bi-telephone me-1"></i> <span class="text-dark" th:text="${company.mainPhone() != null and !company.mainPhone().isEmpty() ? company.mainPhone() : '—'}"></span>
                        </div>
                        <div class="text-muted text-truncate mb-2">
                            <i class="bi bi-envelope me-1"></i> <span class="text-dark" th:text="${company.email() != null and !company.email().isEmpty() ? company.email() : '—'}"></span>
                        </div>
                        <div class="text-muted text-truncate">
                            <i class="bi bi-globe me-1"></i> <span class="text-dark" th:text="${company.website() != null and !company.website().isEmpty() ? company.website() : '—'}"></span>
                        </div>
                    </div>

                    <div class="text-muted small text-truncate mb-2" th:if="${company.notes() != null and !company.notes().isEmpty()}" th:text="${company.notes()}"></div>

                    <div class="d-flex justify-content-end border-top pt-2 mt-2">
                        <div class="btn-group position-relative" style="z-index: 2;">
                            <a th:href="@{/companies/edit/{id}(id=${company.id()})}" class="btn btn-sm btn-outline-warning border-0"><i class="bi bi-pencil-square fs-5"></i></a>
                            <form th:action="@{/companies/delete/{id}(id=${company.id()})}" method="post" onsubmit="return confirm('Видалити цю компанію?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger border-0"><i class="bi bi-trash fs-5"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(companies)}" class="text-center py-4 text-muted">Компаній не знайдено.</div>
        </div>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const rows = document.querySelectorAll(".clickable-row");
        rows.forEach(row => {
            row.addEventListener("click", function(e) {
                if(e.target.closest('button') || e.target.closest('a') || e.target.closest('form')) {
                    return;
                }
                window.location.href = this.getAttribute("data-href");
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
