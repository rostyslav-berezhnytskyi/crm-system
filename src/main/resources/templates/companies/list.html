<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ELS CRM - Компанії</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .clickable-row { cursor: pointer; transition: background-color 0.2s; }
        .clickable-row:hover { background-color: #e9ecef !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/">ELS CRM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/projects">Проєкти</a></li>
                <li class="nav-item"><a class="nav-link" href="/transactions">Транзакції</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacts">Контакти</a></li>
                <li class="nav-item"><a class="nav-link active" href="/companies">Компанії</a></li>
                <li class="nav-item"><a class="nav-link" href="/users">Співробітники</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Вийти
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🏢 Довідник компаній</h2>
        <div>
            <a href="/contacts" class="btn btn-outline-secondary me-2">Переглянути контакти</a>
            <a href="/companies/new" class="btn btn-primary">+ Додати компанію</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Назва</th>
                    <th>Вебсайт</th>
                    <th>Телефон</th>
                    <th>Електронна пошта</th>
                    <th>Нотатки</th>
                    <th class="text-center">Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="company : ${companies}" class="clickable-row" th:data-href="@{/companies/{id}(id=${company.id()})}">
                    <td class="fw-bold align-middle text-dark" th:text="${company.name()}"></td>
                    <td class="align-middle text-muted" th:text="${company.website()}"></td>
                    <td class="align-middle" th:text="${company.mainPhone()}"></td>
                    <td class="align-middle" th:text="${company.email()}"></td>
                    <td class="align-middle text-muted small" th:text="${company.notes()}"></td>
                    <td class="align-middle">
                        <div class="d-flex justify-content-center">
                            <a th:href="@{/companies/edit/{id}(id=${company.id()})}" class="btn btn-sm btn-outline-warning me-2" title="Редагувати"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/companies/delete/{id}(id=${company.id()})}" method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цю компанію?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Видалити"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(companies)}">
                    <td colspan="6" class="text-center py-4 text-muted">Компаній не знайдено.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const rows = document.querySelectorAll(".clickable-row");
        rows.forEach(row => {
            row.addEventListener("click", function(e) {
                if(e.target.closest('button') || e.target.closest('a') || e.target.closest('form')) {
                    return;
                }
                window.location.href = this.getAttribute("data-href");
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
