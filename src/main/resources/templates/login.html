<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Вхід')}"></head>

<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">

            <div class="text-center mb-4">
                <h1 class="fw-bold text-primary mb-0">ELS CRM</h1>
                <p class="text-muted small">Система керування</p>
            </div>

            <div class="card shadow-sm border-0" style="border-radius: 16px;">
                <div class="card-body p-4 p-md-5">
                    <h4 class="text-center mb-4 fw-bold">🔐 Вхід у систему</h4>

                    <div th:if="${param.error}" class="alert alert-danger text-center small py-2">
                        Неправильний логін або пароль.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success text-center small py-2">
                        Ви успішно вийшли з системи.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small">Логін</label>
                            <input type="text" name="username" class="form-control form-control-lg fs-6" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small">Пароль</label>
                            <input type="password" name="password" class="form-control form-control-lg fs-6" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">Увійти</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
