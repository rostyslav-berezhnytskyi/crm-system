<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ELS CRM - Редагувати співробітника</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/static">ELS CRM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/projects">Проєкти</a></li>
                <li class="nav-item"><a class="nav-link" href="/transactions">Транзакції</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacts">Контакти</a></li>
                <li class="nav-item"><a class="nav-link" href="/companies">Компанії</a></li>
                <li class="nav-item"><a class="nav-link active" href="/users">Співробітники</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Вийти
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mb-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-dark text-white d-flex justify-content-between">
            <h4 class="mb-0">✏️ Редагувати співробітника: <span th:text="${user.username}"></span></h4>
            <a href="/users" class="btn btn-sm btn-outline-light">Назад</a>
        </div>
        <div class="card-body">

            <form th:action="@{/users/edit/{id}(id=${user.id})}" method="post" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label fw-bold">Фото профілю</label>
                    <input type="file" name="photo" class="form-control" accept="image/*">
                    <small class="text-muted" th:if="${user.photoUrl != null}">
                        Поточне фото: <span th:text="${user.photoUrl}"></span>
                    </small>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Логін</label>
                        <input type="text" name="username" class="form-control" th:value="${user.username}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Електронна пошта</label>
                        <input type="email" name="email" class="form-control" th:value="${user.email}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Номер телефону</label>
                        <input type="text" name="phoneNumber" class="form-control" th:value="${user.phoneNumber}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Telegram ID</label>
                        <input type="text" name="telegramId" class="form-control" th:value="${user.telegramId}">
                    </div>
                </div>

                <hr>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Роль у системі</label>
                        <select name="role" class="form-select" required>
                            <option th:each="r : ${roles}"
                                    th:value="${r.name()}"
                                    th:text="${r.ukrainianName}"
                                    th:selected="${r == user.role}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3 d-flex align-items-end">
                        <div class="form-check form-switch mb-2">
                            <input type="hidden" name="_enabled" value="on">
                            <input class="form-check-input" type="checkbox" name="enabled" value="true" th:checked="${user.enabled}">
                            <label class="form-check-label text-danger fw-bold">Акаунт активний</label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Скинути пароль <span class="text-muted fw-normal">(Необов'язково)</span></label>
                    <input type="password" name="newPassword" class="form-control" autocomplete="new-password" placeholder="Залиште порожнім, щоб зберегти поточний пароль">
                </div>

                <button type="submit" class="btn btn-primary w-100">Зберегти зміни</button>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
