<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Редагувати співробітника')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5 d-flex justify-content-center">
    <div class="w-100" style="max-width: 650px;">
        <div class="card shadow-sm border-0">

            <div class="card-header bg-dark text-white d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 py-3">
                <h5 class="mb-0">✏️ Редагувати: <span class="fw-bold" th:text="${user.username}"></span></h5>
                <div class="d-grid d-sm-block">
                    <a href="/users" class="btn btn-sm btn-outline-light text-nowrap w-100 w-sm-auto">Назад</a>
                </div>
            </div>

            <div class="card-body p-4">

                <form th:action="@{/users/edit/{id}(id=${user.id})}" method="post" enctype="multipart/form-data">

                    <div class="p-3 bg-white border rounded mb-4 shadow-sm">
                        <label class="form-label fw-bold text-secondary"><i class="bi bi-person-bounding-box me-1"></i> Фото профілю</label>

                        <div th:if="${user.photoUrl != null}" class="alert alert-secondary py-2 px-3 small mb-3 d-flex justify-content-between align-items-center">
                            <span>Поточне фото:</span>
                            <a th:href="@{'/uploads/' + ${user.photoUrl}}" target="_blank" class="btn btn-sm btn-outline-primary py-0">Переглянути</a>
                        </div>

                        <input type="file" name="photo" class="form-control form-control-sm" accept="image/*">
                        <div class="form-text mt-2" style="font-size: 0.75rem;">Завантажте новий файл, щоб замінити поточний.</div>
                    </div>

                    <div class="row gy-3 mb-4">
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-muted small">Логін</label>
                            <input type="text" name="username" class="form-control" th:value="${user.username}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-muted small">Електронна пошта</label>
                            <input type="email" name="email" class="form-control" th:value="${user.email}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-muted small">Номер телефону</label>
                            <input type="text" name="phoneNumber" class="form-control" th:value="${user.phoneNumber}">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-muted small">Telegram ID</label>
                            <input type="text" name="telegramId" class="form-control" th:value="${user.telegramId}">
                        </div>
                    </div>

                    <hr class="text-muted opacity-25 mb-4">

                    <div class="row gy-3 mb-4">
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-muted small">Роль у системі</label>
                            <select name="role" class="form-select" required>
                                <option th:each="r : ${roles}"
                                        th:value="${r.name()}"
                                        th:text="${r.ukrainianName}"
                                        th:selected="${r == user.role}"></option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6 d-flex align-items-center mt-4 mt-md-auto mb-1">
                            <div class="form-check form-switch fs-5">
                                <input type="hidden" name="_enabled" value="on">
                                <input class="form-check-input" type="checkbox" role="switch" name="enabled" value="true" th:checked="${user.enabled}" id="enabledSwitch">
                                <label class="form-check-label text-danger fw-bold ms-2" for="enabledSwitch" style="font-size: 1rem;">Акаунт активний</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4 p-3 bg-light rounded border">
                        <label class="form-label fw-bold text-danger"><i class="bi bi-shield-lock me-1"></i> Скинути пароль</label>
                        <input type="password" name="newPassword" class="form-control" autocomplete="new-password" placeholder="Введіть новий пароль">
                        <div class="form-text mt-2" style="font-size: 0.75rem;">Залиште порожнім, якщо не бажаєте змінювати поточний пароль.</div>
                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-between mt-5 gap-3">
                        <a href="/users" class="btn btn-secondary px-4 w-100 w-sm-auto shadow-sm">Скасувати</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold w-100 w-sm-auto shadow-sm">Зберегти зміни</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
