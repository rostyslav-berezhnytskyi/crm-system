<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ELS CRM - Співробітники</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/static">ELS CRM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/projects">Проєкти</a></li>
                <li class="nav-item"><a class="nav-link" href="/transactions">Транзакції</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacts">Контакти</a></li>
                <li class="nav-item"><a class="nav-link" href="/companies">Компанії</a></li>
                <li class="nav-item"><a class="nav-link" href="/users">Співробітники</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Вийти
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👥 Керування співробітниками</h2>
        <a href="/register" class="btn btn-success">
            + Зареєструвати співробітника
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Користувач</th>
                    <th>Електронна пошта</th>
                    <th>Роль</th>
                    <th>Статус</th>
                    <th>Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}" class="align-middle">
                    <td th:text="${user.id}">1</td>
                    <td>
                        <a th:href="@{'/uploads/' + ${user.photoUrl}}" target="_blank">
                            <img th:if="${user.photoUrl != null}" th:src="@{'/uploads/' + ${user.photoUrl}}"
                                 class="rounded-circle me-2" style="width: 30px; height: 30px; object-fit: cover; border: 1px solid #ccc;">
                        </a>
                        <span class="fw-bold" th:text="${user.username}">rostik</span>
                    </td>
                    <td th:text="${user.email}">mail@els.com</td>
                    <td>
                        <span th:class="${user.role.name() == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-primary'"
                              th:text="${user.role.ukrainianName}">Адміністратор</span>
                    </td>
                    <td>
                        <span th:if="${user.enabled}" class="badge bg-success">Активний</span>
                        <span th:unless="${user.enabled}" class="badge bg-secondary">Вимкнено</span>
                    </td>
                    <td>
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-dark">Редагувати</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
