<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Співробітники')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
        <h2 class="mb-0 text-center text-sm-start">👥 Співробітники</h2>
        <div class="w-100 d-flex justify-content-center justify-content-sm-end">
            <a href="/register" class="btn btn-success text-nowrap w-100 w-sm-auto shadow-sm" style="max-width: 420px;">
                <i class="bi bi-person-plus me-1"></i> Додати співробітника
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0 d-none d-lg-block mb-4">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Користувач</th>
                    <th>Електронна пошта</th>
                    <th>Роль</th>
                    <th>Статус</th>
                    <th class="text-center pe-4">Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td class="ps-4 text-muted" th:text="${user.id}"></td>
                    <td>
                        <div class="d-flex align-items-center">
                            <a th:if="${user.photoUrl != null}" th:href="@{'/uploads/' + ${user.photoUrl}}" target="_blank">
                                <img th:src="@{'/uploads/' + ${user.photoUrl}}" class="rounded-circle me-3 shadow-sm" style="width: 35px; height: 35px; object-fit: cover; border: 1px solid #dee2e6;">
                            </a>
                            <i th:unless="${user.photoUrl != null}" class="bi bi-person-circle fs-3 text-secondary me-3"></i>

                            <span class="fw-bold text-dark" th:text="${user.username}"></span>
                        </div>
                    </td>
                    <td class="text-muted" th:text="${user.email}"></td>
                    <td>
                        <span th:class="${user.role.name() == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-primary'"
                              th:text="${user.role.ukrainianName}"></span>
                    </td>
                    <td>
                        <span th:if="${user.enabled}" class="badge bg-success bg-opacity-10 text-success">Активний</span>
                        <span th:unless="${user.enabled}" class="badge bg-secondary bg-opacity-10 text-secondary">Вимкнено</span>
                    </td>
                    <td class="text-center pe-4">
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary border-0" title="Редагувати">
                            <i class="bi bi-pencil-square fs-5"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6" class="text-center py-4 text-muted">Співробітників не знайдено.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-lg-none mb-4 d-flex justify-content-center">
        <div class="w-100 px-2" style="max-width: 420px;">

            <div th:each="user : ${users}" class="card shadow-sm border-0 mb-3" style="border-radius: 16px;">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="d-flex align-items-center">
                            <a th:if="${user.photoUrl != null}" th:href="@{'/uploads/' + ${user.photoUrl}}" target="_blank">
                                <img th:src="@{'/uploads/' + ${user.photoUrl}}" class="rounded-circle me-3 shadow-sm" style="width: 45px; height: 45px; object-fit: cover; border: 1px solid #dee2e6;">
                            </a>
                            <i th:unless="${user.photoUrl != null}" class="bi bi-person-circle fs-1 text-secondary me-3"></i>

                            <div>
                                <strong class="text-dark d-block fs-5" th:text="${user.username}"></strong>
                                <span class="small text-muted" th:text="${user.email}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-light p-2 rounded mb-3 d-flex justify-content-between align-items-center">
                        <div>
                            <span class="small text-muted d-block mb-1">Роль:</span>
                            <span th:class="${user.role.name() == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-primary'" th:text="${user.role.ukrainianName}"></span>
                        </div>
                        <div class="text-end">
                            <span class="small text-muted d-block mb-1">Статус:</span>
                            <span th:if="${user.enabled}" class="badge bg-success bg-opacity-10 text-success">Активний</span>
                            <span th:unless="${user.enabled}" class="badge bg-secondary bg-opacity-10 text-secondary">Вимкнено</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end border-top pt-2 mt-2">
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary border-0">
                            <i class="bi bi-pencil-square me-1"></i> Редагувати
                        </a>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(users)}" class="text-center py-4 text-muted">Співробітників не знайдено.</div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
