<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Помилка сервера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="text-center container">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 5rem;"></i>
    <h2 class="mb-3 mt-2 fw-bold text-dark">Щось пішло не так!</h2>
    <p class="text-muted mb-4">На сервері сталася помилка. Ми не змогли обробити ваш запит.</p>

    <div class="alert alert-danger d-inline-block text-start mb-4 shadow-sm" style="max-width: 600px;">
        <strong>Деталі помилки:</strong>
        <br>
        <span class="font-monospace small" th:text="${errorMessage != null ? errorMessage : 'Невідома помилка сервера.'}"></span>
    </div>

    <br>
    <a href="/" class="btn btn-primary btn-lg shadow-sm"><i class="bi bi-house"></i> На головну</a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg shadow-sm ms-2">Повернутися</a>
</div>

</body>
</html>
