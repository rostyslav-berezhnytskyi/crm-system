<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Помилка сервера - ELS CRM')}"></head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="text-center container">
    <i class="bi bi-exclamation-triangle-fill text-danger mb-2" style="font-size: 6rem; line-height: 1;"></i>
    <h2 class="mb-3 fw-bold text-dark">Щось пішло не так!</h2>
    <p class="text-muted mb-4 lead">На сервері сталася помилка. Ми не змогли обробити ваш запит.</p>

    <div class="alert alert-danger text-start mb-5 shadow-sm mx-auto" style="max-width: 600px; word-wrap: break-word;">
        <strong><i class="bi bi-bug me-1"></i> Деталі помилки:</strong>
        <hr class="mt-2 mb-2 opacity-25">
        <span class="font-monospace small" th:text="${errorMessage != null ? errorMessage : 'Невідома помилка сервера.'}"></span>
    </div>

    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
        <a href="/" class="btn btn-primary btn-lg shadow-sm px-5"><i class="bi bi-house me-1"></i> На головну</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg shadow-sm px-5">Повернутися</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
