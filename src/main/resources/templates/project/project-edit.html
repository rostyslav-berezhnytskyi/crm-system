<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Редагувати проєкт')}"></head>

<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-xl-10">

            <div class="card shadow-sm mb-4 border-0">

                <div class="card-header bg-warning text-dark d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                    <h5 class="mb-0">✏️ Редагувати: <span class="fw-bold" th:text="${project.name()}"></span></h5>

                    <div class="d-grid d-sm-block">
                        <a href="/projects" class="btn btn-sm btn-outline-dark text-nowrap">Повернутися до списку</a>
                    </div>
                </div>

                <div class="card-body">
                    <form th:action="@{/projects/update/{id}(id=${project.id()})}" method="post">
                        <div class="row mb-3 gy-3">
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Назва проєкту *</label>
                                <input type="text" name="name" class="form-control" th:value="${project.name()}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Статус</label>
                                <select name="active" class="form-select">
                                    <option value="true" th:selected="${project.active() == true}">🟢 Активний (Відкритий)</option>
                                    <option value="false" th:selected="${project.active() == false}">⚪ Завершений (В архіві)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3 p-3 bg-light rounded border">
                            <label class="form-label fw-bold">Розташування</label>
                            <div class="input-group mb-2">
                                <input type="text" name="addressText" id="editAddress" class="form-control" th:value="${project.addressText()}" required>
                                <button type="button" class="btn btn-secondary" onclick="geocodeEditAddress()"><i class="bi bi-geo-alt"></i> Знайти</button>
                            </div>
                            <div class="row">
                                <div class="col-6"><input type="text" name="latitude" id="editLat" class="form-control form-control-sm text-muted" th:value="${project.latitude()}" readonly></div>
                                <div class="col-6"><input type="text" name="longitude" id="editLng" class="form-control form-control-sm text-muted" th:value="${project.longitude()}" readonly></div>
                            </div>
                        </div>

                        <div class="row mb-3 gy-3">
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">Клієнт</label>
                                <select name="clientId" class="form-select search-select">
                                    <option value="">-- Відсутній --</option>
                                    <option th:each="contact : ${clientContacts}" th:value="${contact.id()}" th:text="${contact.name()}" th:selected="${project.clientId() == contact.id()}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">Монтажник</label>
                                <select name="installerId" class="form-select search-select">
                                    <option value="">-- Відсутній --</option>
                                    <option th:each="contact : ${installerContacts}" th:value="${contact.id()}" th:text="${contact.name()}" th:selected="${project.installerId() == contact.id()}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">Постачальник обладнання</label>
                                <select name="equipmentDealerId" class="form-select search-select">
                                    <option value="">-- Відсутній --</option>
                                    <option th:each="company : ${dealerCompanies}" th:value="${company.id()}" th:text="${company.name()}" th:selected="${project.equipmentDealerId() == company.id()}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Опис</label>
                            <textarea name="description" class="form-control" rows="3" th:text="${project.description()}"></textarea>
                        </div>

                        <div class="d-grid d-md-flex justify-content-md-end mt-4">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm px-5">Зберегти зміни</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">📸 Галерея проєкту (Фото та Документи)</h5>
                </div>
                <div class="card-body">
                    <div class="row g-4">

                        <div class="col-md-5 border-md-end border-bottom border-md-bottom-0 pb-4 pb-md-0">
                            <h6 class="fw-bold mb-3">Завантажити файл</h6>
                            <form th:action="@{/projects/{id}/media(id=${project.id()})}" method="post" enctype="multipart/form-data">
                                <div class="mb-3">
                                    <input type="file" name="files" class="form-control" accept="image/*,.pdf,.xls,.xlsx,.doc,.docx" multiple required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small text-muted">Технічний опис (Що на фото?)</label>
                                    <textarea name="description" class="form-control" rows="2" placeholder="Наприклад: Підключення акумуляторного блоку Deye..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-success w-100"><i class="bi bi-cloud-upload"></i> Завантажити</button>
                            </form>
                        </div>

                        <div class="col-md-7">
                            <h6 class="fw-bold mb-3">Завантажені файли</h6>
                            <div th:if="${#lists.isEmpty(gallery)}" class="text-muted small">
                                Ще немає завантажених фотографій для цього проєкту.
                            </div>

                            <div class="list-group" style="max-height: 400px; overflow-y: auto;">
                                <div th:each="media : ${gallery}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                    <div class="pe-2 text-truncate">
                                        <div class="fw-bold text-primary text-truncate">
                                            <a th:href="@{'/uploads/' + ${media.fileUrl()}}" target="_blank">Переглянути файл <i class="bi bi-box-arrow-up-right"></i></a>
                                        </div>
                                        <span class="text-dark d-block text-truncate" th:text="${media.description()}"></span>
                                        <small class="text-muted" th:text="${#temporals.format(media.uploadedAt(), 'dd-MM-yyyy HH:mm')}"></small>
                                    </div>
                                    <form th:action="@{/projects/media/{mediaId}/delete(mediaId=${media.id()})}" method="post" onsubmit="return confirm('Видалити цей файл?');" class="flex-shrink-0">
                                        <input type="hidden" name="projectId" th:value="${project.id()}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger border-0"><i class="bi bi-trash"></i></button>
                                    </form>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function geocodeEditAddress() {
        const address = document.getElementById('editAddress').value;
        fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(address))
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    document.getElementById('editLat').value = data[0].lat;
                    document.getElementById('editLng').value = data[0].lon;
                    alert("📍 Координати оновлено!");
                } else {
                    alert("Не вдалося знайти точні координати.");
                }
            });
    }
</script>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
