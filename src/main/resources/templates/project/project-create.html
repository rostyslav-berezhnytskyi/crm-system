<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Новий проєкт')}"></head>

<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">📝 Створити новий проєкт</h5>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error}" class="alert alert-danger">
                        ⚠️ <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/projects}" method="post" th:object="${newProject}">

                        <div class="mb-4">
                            <label class="fw-bold form-label">Назва проєкту *</label>
                            <input type="text" th:field="*{name}" class="form-control form-control-lg" placeholder="Наприклад: Встановлення Deye 50kW на Абалмасова" required>
                        </div>

                        <div class="p-3 bg-light rounded border mb-4">
                            <label class="fw-bold form-label">Розташування об'єкта *</label>
                            <div class="input-group mb-2">
                                <input type="text" th:field="*{addressText}" id="addressInput" class="form-control" placeholder="Київ, вул. Абалмасова 1" required>
                                <button type="button" class="btn btn-secondary" onclick="geocodeAddress()"><i class="bi bi-geo-alt"></i> Знайти</button>
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="text" th:field="*{latitude}" id="latInput" class="form-control text-muted" placeholder="Широта (Авто)" readonly>
                                </div>
                                <div class="col-6">
                                    <input type="text" th:field="*{longitude}" id="lngInput" class="form-control text-muted" placeholder="Довгота (Авто)" readonly>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-4 gy-3">
                            <div class="col-md-4">
                                <label class="fw-bold text-muted small form-label">Клієнт (ОСББ, Власник)</label>
                                <select th:field="*{clientId}" class="form-select">
                                    <option value="">-- Оберіть клієнта --</option>
                                    <option th:each="contact : ${contacts}" th:value="${contact.id()}" th:text="${contact.name()}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="fw-bold text-muted small form-label">Головний монтажник</label>
                                <select th:field="*{installerId}" class="form-select">
                                    <option value="">-- Оберіть монтажника --</option>
                                    <option th:each="contact : ${contacts}" th:value="${contact.id()}" th:text="${contact.name()}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="fw-bold text-muted small form-label">Постачальник (Де купили?)</label>
                                <select th:field="*{equipmentDealerId}" class="form-select">
                                    <option value="">-- Оберіть компанію --</option>
                                    <option th:each="company : ${companies}" th:value="${company.id()}" th:text="${company.name()}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="fw-bold form-label">Технічний опис</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Деталі системи, потужність, специфікації..."></textarea>
                        </div>

                        <div class="d-flex flex-column flex-sm-row justify-content-between mt-4 gap-2">
                            <a href="/projects" class="btn btn-secondary px-4 w-100 w-sm-auto">Скасувати</a>
                            <button type="submit" class="btn btn-primary px-5 fw-bold w-100 w-sm-auto">Створити проєкт</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function geocodeAddress() {
        const address = document.getElementById('addressInput').value;
        if (!address) { alert("Будь ласка, введіть адресу спочатку."); return; }
        fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(address))
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    document.getElementById('latInput').value = data[0].lat;
                    document.getElementById('lngInput').value = data[0].lon;
                    alert("📍 GPS координати знайдено та збережено!");
                } else {
                    alert("Не вдалося знайти точні координати.");
                }
            });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
