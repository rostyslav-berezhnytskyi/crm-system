<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ELS CRM - Edit Transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">✏️ Edit Transaction</h5>
                </div>
                <div class="card-body">

                    <form th:action="@{/transactions/update/{id}(id=${transactionId})}"
                          th:object="${transaction}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label fw-bold">Project</label>
                                <select th:field="*{projectId}" class="form-select" required>
                                    <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Type</label>
                                <select th:field="*{type}" class="form-select">
                                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select th:field="*{category}" class="form-select">
                                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Amount</label>
                                <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Payment Method</label>
                                <select th:field="*{paymentMethod}" class="form-select">
                                    <option th:each="m : ${paymentMethods}" th:value="${m}" th:text="${m}"></option>
                                </select>
                            </div>

                            <div class="col-md-12 mb-3">
                                <label class="form-label">Date</label>
                                <input type="datetime-local" th:field="*{date}" class="form-control">
                            </div>

                            <div class="col-md-12 mb-3">
                                <label class="form-label">Description</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Receipt</label>

                                <div th:if="${currentReceipt}" class="alert alert-secondary py-1 px-2 small mb-2">
                                    Current: <a th:href="@{'/uploads/' + ${currentReceipt}}" target="_blank">View File</a>
                                </div>

                                <input type="file" name="receiptFile" class="form-control" accept="image/*,.pdf">
                                <small class="text-muted">Upload new file to replace current one.</small>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Item Photo</label>

                                <div th:if="${currentItemImage}" class="alert alert-secondary py-1 px-2 small mb-2">
                                    Current: <a th:href="@{'/uploads/' + ${currentItemImage}}" target="_blank">View File</a>
                                </div>

                                <input type="file" name="itemImageFile" class="form-control" accept="image/*">
                            </div>

                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/transactions" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning px-5">Update Transaction</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
