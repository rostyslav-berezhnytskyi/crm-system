<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Реєстрація')}"></head>

<body class="bg-light d-flex align-items-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary mb-0">ELS CRM</h2>
            </div>

            <div class="card shadow-sm border-0" style="border-radius: 16px;">
                <div class="card-body p-4 p-md-5">
                    <h4 class="text-center mb-4 fw-bold">📝 Створення акаунту</h4>

                    <div th:if="${error}" class="alert alert-danger text-center small py-2">
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small">Логін *</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="Придумайте логін" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small">Електронна пошта *</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="ім'я@els.com" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small">Номер телефону</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="+380...">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small">Пароль *</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Мінімум 6 символів" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">Зареєструватися</button>

                        <div class="text-center mt-4">
                            <a href="/login" class="text-decoration-none text-secondary small">Вже є акаунт? <span class="text-primary fw-bold">Увійти</span></a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
