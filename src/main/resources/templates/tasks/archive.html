<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Архів задач')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
        <div>
            <h2 class="mb-1 text-center text-sm-start text-muted">
                <i class="bi bi-archive-fill me-2"></i>Архів виконаних задач
            </h2>
            <p class="text-muted small mb-0 text-center text-sm-start">Історія всіх завершених робіт по системі</p>
        </div>
        <div class="d-flex justify-content-center justify-content-sm-end gap-2">
            <a href="/tasks" class="btn btn-outline-primary shadow-sm px-4">
                <i class="bi bi-kanban me-2"></i>На дошку
            </a>
        </div>
    </div>

    <div th:replace="~{fragments :: filterAccordion(~{::#taskFilterForm})}">
        <div id="taskFilterForm">

                <div class="row g-3 align-items-end mb-3">
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1 fw-bold">Текст (Назва/Опис)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" id="filterSearch" class="form-control border-start-0 ps-0" placeholder="Введіть слова..." onkeyup="applyFilters()">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted mb-1 fw-bold">Пріоритет</label>
                        <select id="filterPriority" class="form-select" onchange="applyFilters()">
                            <option value="">Всі пріоритети</option>
                            <option value="LOW">Низький</option>
                            <option value="MEDIUM">Середній</option>
                            <option value="HIGH">Високий</option>
                            <option value="URGENT">Терміновий</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1 fw-bold">Виконавець</label>
                        <select id="filterAssignee" class="search-select" onchange="applyFilters()">
                            <option value="">Всі виконавці...</option>
                            <option th:each="u : ${users}" th:value="${u.username}" th:text="${u.username}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1 fw-bold">Період (Дедлайн)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted">З</span>
                            <input type="date" id="filterDateFrom" class="form-control" onchange="applyFilters()">
                            <span class="input-group-text bg-light text-muted">По</span>
                            <input type="date" id="filterDateTo" class="form-control" onchange="applyFilters()">
                        </div>
                    </div>
                </div>

                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1 fw-bold">Проєкт</label>
                        <select id="filterProject" class="search-select" onchange="applyFilters()">
                            <option value="">Всі проєкти...</option>
                            <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted mb-1 fw-bold">Компанія</label>
                        <select id="filterCompany" class="search-select" onchange="applyFilters()">
                            <option value="">Всі компанії...</option>
                            <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1 fw-bold">Контакт</label>
                        <select id="filterContact" class="search-select" onchange="applyFilters()">
                            <option value="">Всі контакти...</option>
                            <option th:each="ct : ${contacts}" th:value="${ct.id}" th:text="${ct.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-outline-secondary w-100" onclick="clearFilters()" title="Скинути фільтри">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </div>
                </div>

        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4" style="border-radius: 12px;">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover mb-0 bg-white">
                <thead class="table-light">
                <tr>
                    <th class="ps-3 py-3 text-center" style="width: 40px;"></th>
                    <th class="py-3">Назва задачі та Опис</th>
                    <th class="py-3 d-none d-md-table-cell" style="width: 12%;">Пріоритет</th>
                    <th class="py-3 d-none d-md-table-cell" style="width: 18%;">Виконавець</th>
                    <th class="text-end pe-4 py-3 d-none d-md-table-cell" style="width: 15%;">Дедлайн / Виконано</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}"
                    class="clickable-row task-card text-muted bg-light align-middle"
                    style="cursor: pointer;"
                    th:attr="data-task-id=${task.id},
                             data-priority=${task.priority.name()},
                             data-assignee=${task.assigneeName != null ? task.assigneeName.toLowerCase() : ''},
                             data-project-id=${task.projectId != null ? task.projectId : ''},
                             data-company-id=${task.companyId != null ? task.companyId : ''},
                             data-contact-id=${task.contactId != null ? task.contactId : ''},
                             data-due-date=${task.dueDate != null ? task.dueDate : ''}"
                    onclick="openTaskDetails(this)">

                    <td class="text-center ps-3">
                        <i class="bi bi-check-circle-fill text-success fs-5"></i>
                    </td>

                    <td class="py-3">
                        <strong class="d-block text-decoration-line-through mb-1 text-dark" th:text="${task.title}"></strong>

                        <div th:if="${task.description() != null and !task.description().isEmpty()}"
                             class="text-muted small mb-2"
                             style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                             th:text="${task.description()}">
                        </div>

                        <div th:if="${task.projectName != null or task.companyName != null or task.contactName != null}" class="text-muted mb-2" style="font-size: 0.75rem;">
                            <span th:if="${task.projectName != null}"><i class="bi bi-folder2 me-1"></i><span th:text="${task.projectName}"></span></span>
                            <span th:if="${task.companyName != null}" th:classappend="${task.projectName != null ? 'ms-2 border-start ps-2' : ''}"><i class="bi bi-buildings me-1"></i><span th:text="${task.companyName}"></span></span>
                            <span th:if="${task.contactName != null}" th:classappend="${task.projectName != null or task.companyName != null ? 'ms-2 border-start ps-2' : ''}"><i class="bi bi-person-vcard me-1"></i><span th:text="${task.contactName}"></span></span>
                        </div>

                        <div class="d-flex flex-wrap align-items-center gap-3 d-md-none mt-2 pt-2 border-top border-secondary border-opacity-10">
                            <span class="badge" style="font-size: 0.65rem;" th:classappend="${task.priority().name() == 'LOW' ? 'bg-secondary' : task.priority().name() == 'MEDIUM' ? 'bg-info text-dark' : task.priority().name() == 'HIGH' ? 'bg-warning text-dark' : 'bg-danger'}" th:text="${task.priority().getUkrainianName()}"></span>

                            <div class="small" style="font-size: 0.75rem;">
                                <i class="bi bi-person-fill text-muted me-1"></i>
                                <span th:if="${task.assigneeName != null}" th:text="${task.assigneeName}"></span>
                                <span th:if="${task.assigneeName == null}" class="fst-italic text-muted">Не призначено</span>
                            </div>

                            <div class="small ms-auto text-end" style="font-size: 0.75rem;">
                                <div class="text-muted mb-1">
                                    <i class="bi bi-calendar-event me-1"></i>
                                    <span th:if="${task.dueDate != null}" th:text="${#temporals.format(task.dueDate, 'dd.MM.yy')}"></span>
                                    <span th:if="${task.dueDate == null}">—</span>
                                </div>
                                <div class="text-success fw-bold">
                                    <i class="bi bi-check2-circle me-1"></i>
                                    <span th:if="${task.completedAt != null}" th:text="${#temporals.format(task.completedAt, 'dd.MM.yy')}"></span>
                                </div>
                            </div>
                        </div>
                    </td>

                    <td class="d-none d-md-table-cell">
                        <span class="badge" th:classappend="${task.priority().name() == 'LOW' ? 'bg-secondary' : task.priority().name() == 'MEDIUM' ? 'bg-info text-dark' : task.priority().name() == 'HIGH' ? 'bg-warning text-dark' : 'bg-danger'}" th:text="${task.priority().getUkrainianName()}"></span>
                    </td>

                    <td class="d-none d-md-table-cell">
                        <div th:if="${task.assigneeName != null}">
                            <i class="bi bi-person-fill text-muted me-1"></i><span th:text="${task.assigneeName}"></span>
                        </div>
                        <span th:if="${task.assigneeName == null}" class="fst-italic small text-muted">Не призначено</span>
                    </td>

                    <td class="text-end pe-4 d-none d-md-table-cell">
                        <div class="text-muted small mb-1" title="Оригінальний дедлайн">
                            <i class="bi bi-calendar-event me-1"></i>
                            <span th:if="${task.dueDate != null}" th:text="${#temporals.format(task.dueDate, 'dd.MM.yyyy')}"></span>
                            <span th:if="${task.dueDate == null}">—</span>
                        </div>
                        <div class="text-success fw-bold small" title="Фактично виконано">
                            <i class="bi bi-check2-circle me-1"></i>
                            <span th:if="${task.completedAt != null}" th:text="${#temporals.format(task.completedAt, 'dd.MM.yyyy HH:mm')}"></span>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="5" class="text-center py-5">
                        <i class="bi bi-inbox d-block text-muted opacity-25 mb-2" style="font-size: 2.5rem;"></i>
                        <span class="text-muted">Архів порожній</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${totalPages > 1}" class="card-footer bg-white border-top-0 py-3">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/tasks/archive(page=${currentPage - 1})}">Попередня</a>
                </li>
                <li class="page-item disabled">
                    <span class="page-link" th:text="${currentPage + 1} + ' з ' + ${totalPages}"></span>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 == totalPages ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/tasks/archive(page=${currentPage + 1})}">Наступна</a>
                </li>
            </ul>
        </div>
    </div>
</div>

<div th:replace="~{tasks/components :: modals}"></div>
<div th:replace="~{tasks/components :: scripts}"></div>
<div th:replace="~{fragments :: scripts}"></div>

</body>
</html>
