<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Задачі')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<!-- Page wrapper -->
<div class="container-fluid px-3 px-md-4 mt-4 mb-5">

    <!-- ================================================================
         PAGE HEADER
         ================================================================ -->
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
        <div>
            <h2 class="mb-1 text-center text-sm-start">
                <i class="bi bi-kanban-fill me-2 text-primary"></i>Дошка задач
            </h2>
            <p class="text-muted small mb-0 text-center text-sm-start">Перетягуйте картки між колонками щоб змінити
                статус</p>
        </div>
        <div class="d-flex justify-content-center justify-content-sm-end">
            <button class="btn btn-primary shadow-sm px-4" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                <i class="bi bi-plus-circle me-2"></i>Створити задачу
            </button>
        </div>
    </div>

    <!-- ================================================================
         KANBAN BOARD — horizontally scrolling flex container
         ================================================================ -->
    <div class="d-flex flex-nowrap overflow-auto gap-3 pb-4"
         style="align-items: flex-start; min-height: calc(100vh - 220px);">

        <!-- ── COLUMN (one per TaskGroup) ───────────────────────────── -->
        <div th:each="group : ${taskGroups}"
             class="flex-shrink-0 rounded-3 shadow-sm"
             style="min-width: 320px; width: 320px; background-color: #f8f9fa;">

            <!-- Column header with colorHex top border -->
            <div class="px-3 pt-3 pb-2 rounded-top-3 bg-white"
                 th:style="${'border-top: 4px solid ' + (group.colorHex != null ? group.colorHex : '#6c757d') + ';'}">
                <div class="d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold text-dark" th:text="${group.name}">Колонка</h6>
                    <span class="badge rounded-pill bg-secondary"
                          th:text="${#lists.size(group.tasks.?[parentTask == null])}">0</span>
                </div>
            </div>

            <!-- ── TASK LIST (SortableJS target) ────────────────────── -->
            <div class="task-list p-2 d-flex flex-column gap-2"
                 th:attr="data-group-id=${group.id}"
                 style="min-height: 80px;">

                <!-- ── TASK CARD ─────────────────────────────────────── -->
                <div th:each="task : ${group.tasks}" th:if="${task.parentTask == null}"
                     class="card border-0 shadow-sm task-card"
                     th:attr="data-task-id=${task.id}"
                     style="border-radius: 10px; cursor: grab;"
                     onclick="openTaskDetails(this)">
                    <div class="card-body p-3">

                        <!-- Row 1: priority badge + delete button -->
                        <div class="d-flex justify-content-between align-items-start mb-2">

                            <span class="badge"
                                  th:classappend="${task.priority.name() == 'LOW'    ? 'bg-secondary'         :
                                                   task.priority.name() == 'MEDIUM'  ? 'bg-info text-dark'    :
                                                   task.priority.name() == 'HIGH'    ? 'bg-warning text-dark' :
                                                                                        'bg-danger'}"
                                  th:text="${task.priority.ukrainianName}">Пріоритет</span>

                            <button class="btn btn-sm btn-link text-danger p-0 lh-1"
                                    title="Видалити задачу"
                                    th:attr="data-task-id=${task.id}"
                                    onclick="deleteTask(this, event)">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                        <!-- Row 2: title (strikethrough when completed) -->
                        <p class="mb-2 fw-semibold small"
                           th:classappend="${task.completed ? 'text-decoration-line-through text-muted' : 'text-dark'}"
                           th:text="${task.title}">Назва задачі</p>

                        <!-- Row 3: assignee -->
                        <div th:if="${task.assignee != null}"
                             class="d-flex align-items-center gap-1 mb-1">
                            <i class="bi bi-person-fill text-muted" style="font-size: 0.8rem;"></i>
                            <span class="small text-muted" th:text="${task.assignee.username}">Виконавець</span>
                        </div>

                        <!-- Row 4: due date (red if overdue and not completed) -->
                        <div th:if="${task.dueDate != null}"
                             class="d-flex align-items-center gap-1 mb-1">
                            <i class="bi bi-calendar-event" style="font-size: 0.8rem;"
                               th:classappend="${!task.completed and task.dueDate.isBefore(#temporals.createNow()) ? 'text-danger' : 'text-muted'}"></i>
                            <span class="small"
                                  th:classappend="${!task.completed and task.dueDate.isBefore(#temporals.createNow()) ? 'text-danger fw-semibold' : 'text-muted'}"
                                  th:text="${#temporals.format(task.dueDate, 'dd.MM.yyyy HH:mm')}">Дедлайн</span>
                        </div>

                        <!-- Row 5: context badges (project / company / contact) -->
                        <div th:if="${task.linkedProject != null or task.linkedCompany != null or task.linkedContact != null}"
                             class="d-flex flex-wrap gap-1 mt-2">

                            <span th:if="${task.linkedProject != null}"
                                  class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle d-inline-block text-truncate"
                                  style="font-size: 0.7rem; max-width: 100%;">
                                    <i class="bi bi-folder2 me-1"></i>
                                    <span th:text="${task.linkedProject.name}">Проєкт</span>
                                </span>

                            <span th:if="${task.linkedCompany != null}"
                                  class="badge bg-success bg-opacity-10 text-success border border-success-subtle d-inline-block text-truncate"
                                  style="font-size: 0.7rem; max-width: 100%;">
                                    <i class="bi bi-buildings me-1"></i>
                                    <span th:text="${task.linkedCompany.name}">Компанія</span>
                                </span>

                            <span th:if="${task.linkedContact != null}"
                                  class="badge bg-warning bg-opacity-10 text-warning border border-warning-subtle d-inline-block text-truncate"
                                  style="font-size: 0.7rem; max-width: 100%;">
                                    <i class="bi bi-person-vcard me-1"></i>
                                    <span th:text="${task.linkedContact.name}">Контакт</span>
                                </span>

                        </div>

                    </div>
                </div>
                <!-- /task card -->

                <!-- Empty state -->
                <div th:if="${#lists.isEmpty(group.tasks)}"
                     class="text-center py-4 text-muted small empty-placeholder">
                    <i class="bi bi-inbox d-block opacity-25" style="font-size: 2rem;"></i>
                    <span>Немає задач</span>
                </div>

            </div>
            <!-- /task-list -->

        </div>
        <!-- /column -->

    </div>
    <!-- /board -->

</div>

<div th:replace="~{tasks/components :: modals}"></div>

<div th:replace="~{tasks/components :: scripts}"></div>

<div th:replace="~{fragments :: scripts}"></div>

</body>
</html>
