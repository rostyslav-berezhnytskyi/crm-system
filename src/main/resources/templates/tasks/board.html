<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Задачі')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
        <div>
            <h2 class="mb-1 text-center text-sm-start">
                <i class="bi bi-kanban-fill me-2 text-primary"></i>Дошка задач
            </h2>
            <p class="text-muted small mb-0 text-center text-sm-start">Перетягуйте картки між колонками щоб змінити статус</p>
        </div>
        <div class="d-flex justify-content-center justify-content-sm-end gap-2">
            <a href="/tasks/archive" class="btn btn-outline-secondary shadow-sm px-4">
                <i class="bi bi-archive me-2"></i>Архів
            </a>
            <button class="btn btn-primary shadow-sm px-4" onclick="openCreateModal()">
                <i class="bi bi-plus-circle me-2"></i>Створити задачу
            </button>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4" style="border-radius: 12px;">
        <div class="card-body p-3">
            <div class="row g-3 align-items-end mb-3">
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1 fw-bold">Текст (Назва/Опис)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="filterSearch" class="form-control border-start-0 ps-0" placeholder="Введіть слова..." onkeyup="applyFilters()">
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-1 fw-bold">Пріоритет</label>
                    <select id="filterPriority" class="form-select" onchange="applyFilters()">
                        <option value="">Всі пріоритети</option>
                        <option value="LOW">Низький</option>
                        <option value="MEDIUM">Середній</option>
                        <option value="HIGH">Високий</option>
                        <option value="URGENT">Терміновий</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1 fw-bold">Виконавець</label>
                    <select id="filterAssignee" class="search-select" onchange="applyFilters()">
                        <option value="">Всі виконавці...</option>
                        <option th:each="u : ${users}" th:value="${u.username}" th:text="${u.username}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted mb-1 fw-bold">Період (Дедлайн)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted">З</span>
                        <input type="date" id="filterDateFrom" class="form-control" onchange="applyFilters()">
                        <span class="input-group-text bg-light text-muted">По</span>
                        <input type="date" id="filterDateTo" class="form-control" onchange="applyFilters()">
                    </div>
                </div>
            </div>

            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small text-muted mb-1 fw-bold">Проєкт</label>
                    <select id="filterProject" class="search-select" onchange="applyFilters()">
                        <option value="">Всі проєкти...</option>
                        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted mb-1 fw-bold">Компанія</label>
                    <select id="filterCompany" class="search-select" onchange="applyFilters()">
                        <option value="">Всі компанії...</option>
                        <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1 fw-bold">Контакт</label>
                    <select id="filterContact" class="search-select" onchange="applyFilters()">
                        <option value="">Всі контакти...</option>
                        <option th:each="ct : ${contacts}" th:value="${ct.id}" th:text="${ct.name}"></option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-outline-secondary w-100" onclick="clearFilters()" title="Скинути фільтри">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="boardContainer" class="d-flex flex-nowrap overflow-auto gap-3 pb-4" style="align-items: flex-start; min-height: calc(100vh - 220px);">

        <div th:each="group : ${taskGroups}" class="flex-shrink-0 rounded-3 shadow-sm task-group-column" th:attr="data-group-id=${group.id}" style="min-width: 320px; width: 320px; background-color: #f8f9fa;">

            <div class="px-3 pt-3 pb-2 rounded-top-3 bg-white" th:style="${'border-top: 4px solid ' + (group.colorHex != null ? group.colorHex : '#6c757d') + ';'}">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <h6 class="mb-0 fw-bold text-dark group-drag-handle" style="cursor: grab;" th:text="${group.name}">Колонка</h6>
                        <span class="badge rounded-pill bg-secondary" th:text="${#lists.size(group.tasks.?[parentTask == null])}">0</span>
                    </div>

                    <div class="dropdown">
                        <button class="btn btn-sm btn-link text-muted p-0" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-three-dots"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 fs-7">
                            <li>
                                <a class="dropdown-item" href="#"
                                   th:data-id="${group.id}"
                                   th:data-name="${group.name}"
                                   onclick="promptRenameGroup(this.getAttribute('data-id'), this.getAttribute('data-name'))">
                                    <i class="bi bi-pencil me-2 text-warning"></i>Перейменувати
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item text-danger" href="#"
                                   th:data-id="${group.id}"
                                   onclick="deleteGroup(this.getAttribute('data-id'))">
                                    <i class="bi bi-trash me-2"></i>Видалити колонку
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="task-list p-2 d-flex flex-column gap-2" th:attr="data-group-id=${group.id}" style="min-height: 80px;">

                <div th:each="task : ${group.tasks}" th:if="${task.parentTask == null}"
                     class="card shadow-sm task-card transition-all position-relative overflow-hidden"
                     th:classappend="${task.completed ? 'bg-light border-success opacity-75' : 'bg-white border-0'}"
                     th:attr="data-task-id=${task.id},
                              data-priority=${task.priority.name()},
                              data-assignee=${task.assignee != null ? task.assignee.username.toLowerCase() : ''},
                              data-project-id=${task.linkedProject != null ? task.linkedProject.id : ''},
                              data-company-id=${task.linkedCompany != null ? task.linkedCompany.id : ''},
                              data-contact-id=${task.linkedContact != null ? task.linkedContact.id : ''},
                              data-due-date=${task.dueDate != null ? task.dueDate : ''}"
                     style="border-radius: 10px; cursor: grab;"
                     onclick="openTaskDetails(this)">

                    <div th:if="${task.completed}" class="completed-stamp">ВИКОНАНО</div>

                    <div class="card-body p-3" style="position: relative; z-index: 2;">

                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge"
                                  th:classappend="${task.priority.name() == 'LOW'    ? 'bg-secondary'         :
                                                   task.priority.name() == 'MEDIUM'  ? 'bg-info text-dark'    :
                                                   task.priority.name() == 'HIGH'    ? 'bg-warning text-dark' :
                                                                                        'bg-danger'}"
                                  th:text="${task.priority.ukrainianName}">Пріоритет</span>

                            <button class="btn btn-sm btn-link text-danger p-0 lh-1" title="Видалити задачу" th:attr="data-task-id=${task.id}" onclick="deleteTask(this, event)">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                        <p class="mb-2 fw-semibold small"
                           th:classappend="${task.completed ? 'text-decoration-line-through text-success' : 'text-dark'}"
                           th:text="${task.title}">Назва задачі</p>

                        <div th:if="${task.assignee != null}" class="d-flex align-items-center gap-1 mb-1">
                            <i class="bi bi-person-fill text-muted" style="font-size: 0.8rem;"></i>
                            <span class="small text-muted" th:text="${task.assignee.username}">Виконавець</span>
                        </div>

                        <div th:if="${task.dueDate != null}" class="d-flex align-items-center gap-1 mb-1">
                            <i class="bi bi-calendar-event" style="font-size: 0.8rem;" th:classappend="${!task.completed and task.dueDate.isBefore(#temporals.createNow()) ? 'text-danger' : 'text-muted'}"></i>
                            <span class="small" th:classappend="${!task.completed and task.dueDate.isBefore(#temporals.createNow()) ? 'text-danger fw-semibold' : 'text-muted'}" th:text="${#temporals.format(task.dueDate, 'dd.MM.yyyy HH:mm')}">Дедлайн</span>
                        </div>

                        <div th:if="${task.linkedProject != null or task.linkedCompany != null or task.linkedContact != null}" class="d-flex flex-wrap gap-1 mt-2">
                            <a th:if="${task.linkedProject != null}" th:href="@{/projects/{id}(id=${task.linkedProject.id})}" onclick="event.stopPropagation()"
                               class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle text-decoration-none d-inline-block text-truncate" style="font-size: 0.7rem; max-width: 100%;">
                                <i class="bi bi-folder2 me-1"></i><span th:text="${task.linkedProject.name}">Проєкт</span>
                            </a>
                            <a th:if="${task.linkedCompany != null}" th:href="@{/companies/{id}(id=${task.linkedCompany.id})}" onclick="event.stopPropagation()"
                               class="badge bg-success bg-opacity-10 text-success border border-success-subtle text-decoration-none d-inline-block text-truncate" style="font-size: 0.7rem; max-width: 100%;">
                                <i class="bi bi-buildings me-1"></i><span th:text="${task.linkedCompany.name}">Компанія</span>
                            </a>
                            <a th:if="${task.linkedContact != null}" th:href="@{/contacts/{id}(id=${task.linkedContact.id})}" onclick="event.stopPropagation()"
                               class="badge bg-warning bg-opacity-10 text-warning border border-warning-subtle text-decoration-none d-inline-block text-truncate" style="font-size: 0.7rem; max-width: 100%;">
                                <i class="bi bi-person-vcard me-1"></i><span th:text="${task.linkedContact.name}">Контакт</span>
                            </a>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(group.tasks.?[parentTask == null])}" class="text-center py-4 text-muted small empty-placeholder">
                    <i class="bi bi-inbox d-block opacity-25" style="font-size: 2rem;"></i>
                    <span>Немає задач</span>
                </div>

            </div>
        </div>

        <div class="flex-shrink-0 rounded-3 border border-2 border-dashed border-secondary border-opacity-25 d-flex align-items-center justify-content-center ignore-drag"
             style="min-width: 320px; width: 320px; background-color: rgba(248, 249, 250, 0.5); cursor: pointer; transition: background-color 0.2s;"
             onclick="promptCreateGroup()"
             onmouseover="this.style.backgroundColor='#f8f9fa'"
             onmouseout="this.style.backgroundColor='rgba(248, 249, 250, 0.5)'">
            <div class="text-muted fw-semibold">
                <i class="bi bi-plus-lg me-2"></i>Додати колонку
            </div>
        </div>

    </div>
</div>

<div th:replace="~{tasks/components :: modals}"></div>
<div th:replace="~{tasks/components :: scripts}"></div>
<div th:replace="~{fragments :: scripts}"></div>

</body>
</html>
