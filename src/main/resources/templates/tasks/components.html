<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="modals">

    <div class="modal fade" id="createTaskModal" tabindex="-1" aria-labelledby="createTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="createTaskModalLabel">
                        <i class="bi bi-plus-circle me-2"></i>Нова задача
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрити"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="createTaskForm" novalidate>
                        <div class="row gy-3">
                            <div class="col-12">
                                <label for="taskTitle" class="form-label fw-semibold">Назва <span class="text-danger">*</span></label>
                                <input type="text" id="taskTitle" class="form-control" placeholder="Введіть назву задачі" required>
                            </div>
                            <div class="col-12">
                                <label for="taskDescription" class="form-label fw-semibold">Опис</label>
                                <textarea id="taskDescription" class="form-control" rows="3" placeholder="Детальний опис (необов'язково)"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label for="taskPriority" class="form-label fw-semibold">Пріоритет</label>
                                <select id="taskPriority" class="form-select">
                                    <option value="LOW">Низький</option>
                                    <option value="MEDIUM" selected>Середній</option>
                                    <option value="HIGH">Високий</option>
                                    <option value="URGENT">Терміновий</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="taskDueDate" class="form-label fw-semibold">Дедлайн</label>
                                <input type="datetime-local" id="taskDueDate" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="taskGroupId" class="form-label fw-semibold">Колонка <span class="text-danger">*</span></label>
                                <select id="taskGroupId" class="form-select" required>
                                    <option value="" disabled selected>-- Оберіть колонку --</option>
                                    <option th:each="g : ${taskGroups}" th:value="${g.id}" th:text="${g.name}">Колонка</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="taskAssigneeId" class="form-label fw-semibold">Виконавець</label>
                                <select id="taskAssigneeId" class="form-select">
                                    <option value="">-- Не призначено --</option>
                                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}">Користувач</option>
                                </select>
                            </div>
                            <div class="col-12"><hr class="my-0"><p class="text-muted small mb-0 mt-2">Прив'язка до об'єкта (необов'язково)</p></div>
                            <div class="col-md-4">
                                <label for="taskProjectId" class="form-label fw-semibold">Проєкт</label>
                                <select id="taskProjectId" class="form-select">
                                    <option value="">-- Не вказано --</option>
                                    <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}">Проєкт</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="taskCompanyId" class="form-label fw-semibold">Компанія</label>
                                <select id="taskCompanyId" class="form-select">
                                    <option value="">-- Не вказано --</option>
                                    <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}">Компанія</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="taskContactId" class="form-label fw-semibold">Контакт</label>
                                <select id="taskContactId" class="form-select">
                                    <option value="">-- Не вказано --</option>
                                    <option th:each="ct : ${contacts}" th:value="${ct.id}" th:text="${ct.name}">Контакт</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                    <button type="button" class="btn btn-primary" onclick="submitCreateTask()"><i class="bi bi-check-circle me-1"></i>Зберегти</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="taskDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light border-bottom-0 pb-0">
                    <h4 class="modal-title fw-bold text-dark pe-3" id="detailTaskTitle">Назва задачі</h4>
                    <div class="d-flex gap-2 align-items-center">
                        <button class="btn btn-outline-warning btn-sm fw-semibold shadow-sm" onclick="editCurrentTask()">
                            <i class="bi bi-pencil-square me-1"></i>Редагувати
                        </button>
                        <button class="btn btn-outline-success btn-sm fw-semibold shadow-sm" id="toggleCompleteBtn" onclick="toggleCompletion()">
                            <i class="bi bi-check-circle me-1"></i>Готово
                        </button>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
                    </div>
                </div>
                <div class="modal-body p-4 pt-3">
                    <div class="mb-4">
                        <h6 class="fw-bold text-muted mb-2"><i class="bi bi-card-text me-2"></i>Опис</h6>
                        <div id="detailTaskDescription" class="p-3 bg-white border rounded-3" style="min-height: 80px; white-space: pre-wrap;">Опис відсутній.</div>
                    </div>
                    <div class="mb-4" id="detailTaskContextContainer" style="display: none;">
                        <h6 class="fw-bold text-muted mb-2"><i class="bi bi-link-45deg me-2"></i>Прив'язка</h6>
                        <div id="detailTaskContext" class="d-flex flex-wrap gap-2 p-2 bg-white border rounded-3"></div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="fw-bold text-muted mb-0"><i class="bi bi-list-check me-2"></i>Підзадачі</h6>
                            </div>
                            <div class="input-group input-group-sm mb-2">
                                <input type="text" id="newSubtaskTitle" class="form-control" placeholder="Нова підзадача...">
                                <button class="btn btn-outline-primary" type="button" onclick="addSubtask()">Додати</button>
                            </div>
                            <ul id="detailTaskSubtasks" class="list-group list-group-flush border rounded-3 shadow-sm"></ul>
                        </div>
                        <div class="col-md-6">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="fw-bold text-muted mb-0"><i class="bi bi-paperclip me-2"></i>Файли</h6>
                            </div>
                            <div class="input-group input-group-sm mb-2">
                                <input type="file" id="newTaskAttachment" class="form-control">
                                <button class="btn btn-outline-primary" type="button" onclick="uploadAttachment()" id="uploadAttachmentBtn">Завантажити</button>
                            </div>
                            <ul id="detailTaskAttachments" class="list-group list-group-flush border rounded-3 shadow-sm"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="scripts">
    <style>
        .sortable-ghost { opacity: 0.35; background: #dee2e6 !important; border-radius: 10px; }
        .sortable-chosen { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18) !important; transform: rotate(1deg); }
        .task-card:active { cursor: grabbing; }
        .task-list * { user-select: none; }
        .task-list.empty-list { min-height: 120px; }
        .task-list .sortable-chosen ~ .empty-placeholder { display: none !important; }
        .task-list:has(.task-card) .empty-placeholder { display: none !important; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const CSRF_TOKEN  = /*[[${_csrf.token}]]*/ '';
        const CSRF_HEADER = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
        let currentOpenTaskId = null;
        let isEditMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.task-list').forEach(column => {
                Sortable.create(column, {
                    group: 'shared',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    filter: '.empty-placeholder',
                    onEnd(evt) {
                        const taskId = evt.item.dataset.taskId;
                        const newGroupId = evt.to.dataset.groupId;
                        const orderedTaskIds = [...evt.to.querySelectorAll('.task-card')].map(card => parseInt(card.dataset.taskId, 10));

                        fetch(`/api/tasks/${taskId}/move?newGroupId=${newGroupId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', [CSRF_HEADER]: CSRF_TOKEN },
                            body: JSON.stringify(orderedTaskIds)
                        }).then(res => {
                            if (!res.ok) location.reload();
                        }).catch(() => location.reload());
                    }
                });
            });
        });

        function openCreateModal() {
            isEditMode = false;
            document.getElementById('createTaskModalLabel').innerHTML = '<i class="bi bi-plus-circle me-2"></i>Нова задача';
            document.getElementById('createTaskForm').reset();
        }

        function editCurrentTask() {
            if (!currentOpenTaskId) return;
            isEditMode = true;
            bootstrap.Modal.getInstance(document.getElementById('taskDetailsModal')).hide();
            fetch(`/api/tasks/${currentOpenTaskId}`).then(res => res.json()).then(task => {
                document.getElementById('createTaskModalLabel').innerHTML = '<i class="bi bi-pencil-square me-2"></i>Редагування задачі';
                document.getElementById('taskTitle').value = task.title;
                document.getElementById('taskDescription').value = task.description || '';
                document.getElementById('taskPriority').value = task.priority;
                document.getElementById('taskGroupId').value = task.groupId;
                document.getElementById('taskAssigneeId').value = task.assigneeId || '';
                document.getElementById('taskProjectId').value = task.projectId || '';
                document.getElementById('taskCompanyId').value = task.companyId || '';
                document.getElementById('taskContactId').value = task.contactId || '';
                document.getElementById('taskDueDate').value = task.dueDate ? task.dueDate.substring(0, 16) : '';
                new bootstrap.Modal(document.getElementById('createTaskModal')).show();
            });
        }

        function submitCreateTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const groupId = document.getElementById('taskGroupId').value;
            if (!title || !groupId) { alert('Заповніть обов\'язкові поля (Назва та Колонка)'); return; }
            const dueDateRaw = document.getElementById('taskDueDate').value;

            const payload = {
                title: title,
                description: document.getElementById('taskDescription').value.trim() || null,
                priority: document.getElementById('taskPriority').value,
                dueDate: dueDateRaw ? dueDateRaw + ':00' : null,
                groupId: parseInt(groupId, 10),
                assigneeId: document.getElementById('taskAssigneeId').value ? parseInt(document.getElementById('taskAssigneeId').value, 10) : null,
                projectId: document.getElementById('taskProjectId').value ? parseInt(document.getElementById('taskProjectId').value, 10) : null,
                companyId: document.getElementById('taskCompanyId').value ? parseInt(document.getElementById('taskCompanyId').value, 10) : null,
                contactId: document.getElementById('taskContactId').value ? parseInt(document.getElementById('taskContactId').value, 10) : null
            };

            const method = isEditMode ? 'PUT' : 'POST';
            const url = isEditMode ? `/api/tasks/${currentOpenTaskId}` : '/api/tasks';

            fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json', [CSRF_HEADER]: CSRF_TOKEN},
                body: JSON.stringify(payload)
            }).then(res => {
                if (res.ok) location.reload();
                else alert('Помилка збереження');
            });
        }

        function deleteTask(btn, event) {
            event.stopPropagation();
            if (!confirm('Видалити цю задачу? Дія незворотна.')) return;
            fetch(`/api/tasks/${btn.dataset.taskId}`, {
                method: 'DELETE', headers: {[CSRF_HEADER]: CSRF_TOKEN}
            }).then(res => { if (res.ok) location.reload(); else alert('Помилка'); });
        }

        function openTaskDetails(cardElementOrId) {
            const taskId = typeof cardElementOrId === 'object' ? cardElementOrId.dataset.taskId : cardElementOrId;
            currentOpenTaskId = taskId;
            fetch(`/api/tasks/${taskId}`).then(res => res.json()).then(task => {
                document.getElementById('detailTaskTitle').textContent = task.title;
                const btn = document.getElementById('toggleCompleteBtn');
                btn.className = task.completed ? 'btn btn-success btn-sm fw-semibold shadow-sm' : 'btn btn-outline-success btn-sm fw-semibold shadow-sm';
                btn.innerHTML = task.completed ? '<i class="bi bi-arrow-counterclockwise me-1"></i>Повернути в роботу' : '<i class="bi bi-check-circle me-1"></i>Готово';
                document.getElementById('detailTaskDescription').textContent = task.description || 'Опис відсутній.';

                const contextContainer = document.getElementById('detailTaskContextContainer');
                const contextDiv = document.getElementById('detailTaskContext');
                contextDiv.innerHTML = '';
                let hasContext = false;
                if (task.projectName) { contextDiv.innerHTML += `<span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle fs-6"><i class="bi bi-folder2 me-2"></i>${task.projectName}</span>`; hasContext = true; }
                if (task.companyName) { contextDiv.innerHTML += `<span class="badge bg-success bg-opacity-10 text-success border border-success-subtle fs-6"><i class="bi bi-buildings me-2"></i>${task.companyName}</span>`; hasContext = true; }
                if (task.contactName) { contextDiv.innerHTML += `<span class="badge bg-warning bg-opacity-10 text-warning border border-warning-subtle fs-6"><i class="bi bi-person-vcard me-2"></i>${task.contactName}</span>`; hasContext = true; }
                contextContainer.style.display = hasContext ? 'block' : 'none';

                const subtasksUl = document.getElementById('detailTaskSubtasks');
                subtasksUl.innerHTML = '';
                if (task.subtasks && task.subtasks.length > 0) {
                    task.subtasks.sort((a, b) => a.completed === b.completed ? 0 : a.completed ? 1 : -1).forEach(sub => {
                        const strikeClass = sub.completed ? 'text-decoration-line-through text-muted bg-light' : 'fw-semibold text-dark';
                        const iconClass = sub.completed ? 'bi-check-square-fill text-success' : 'bi-square text-secondary';
                        subtasksUl.innerHTML += `
                            <li class="list-group-item d-flex justify-content-between align-items-center ${strikeClass}" style="cursor: pointer; transition: background-color 0.2s;" onclick="toggleSubtask(${sub.id})" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')">
                                <span><i class="bi ${iconClass} me-2 fs-5 align-middle"></i>${sub.title}</span>
                                <button class="btn btn-link text-danger p-0" onclick="deleteTask(this, event)" data-task-id="${sub.id}"><i class="bi bi-x"></i></button>
                            </li>`;
                    });
                } else subtasksUl.innerHTML = '<li class="list-group-item text-muted small bg-light text-center py-3 border-0">Немає пунктів</li>';

                const attachUl = document.getElementById('detailTaskAttachments');
                attachUl.innerHTML = '';
                if (task.attachments && task.attachments.length > 0) {
                    task.attachments.forEach(att => {
                        attachUl.innerHTML += `<li class="list-group-item"><a href="/uploads/${att.fileUrl}" target="_blank" class="text-decoration-none fw-semibold"><i class="bi bi-file-earmark-text me-2"></i>${att.fileName}</a></li>`;
                    });
                } else attachUl.innerHTML = '<li class="list-group-item text-muted small bg-light text-center py-3">Немає файлів</li>';

                let modalInstance = bootstrap.Modal.getInstance(document.getElementById('taskDetailsModal')) || new bootstrap.Modal(document.getElementById('taskDetailsModal'));
                modalInstance.show();
            });
        }

        function toggleCompletion() {
            if (!currentOpenTaskId) return;
            const btn = document.getElementById('toggleCompleteBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Обробка...';
            btn.disabled = true;
            fetch(`/api/tasks/${currentOpenTaskId}/toggle`, { method: 'PATCH', headers: { [CSRF_HEADER]: CSRF_TOKEN } })
                .then(res => { if (res.ok) location.reload(); else { alert('Помилка'); btn.disabled = false; } });
        }

        function toggleSubtask(subtaskId) {
            fetch(`/api/tasks/${subtaskId}/toggle`, { method: 'PATCH', headers: {[CSRF_HEADER]: CSRF_TOKEN} })
                .then(res => { if (res.ok) openTaskDetails(currentOpenTaskId); });
        }

        function addSubtask() {
            if (!currentOpenTaskId) return;
            const titleInput = document.getElementById('newSubtaskTitle');
            if (!titleInput.value.trim()) return;
            const groupId = parseInt(document.querySelector(`.task-card[data-task-id="${currentOpenTaskId}"]`).closest('.task-list').dataset.groupId, 10);

            fetch('/api/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', [CSRF_HEADER]: CSRF_TOKEN},
                body: JSON.stringify({ title: titleInput.value.trim(), groupId: groupId, priority: 'MEDIUM', parentTaskId: parseInt(currentOpenTaskId, 10) })
            }).then(res => {
                if (res.ok) { titleInput.value = ''; openTaskDetails(currentOpenTaskId); }
            });
        }

        function uploadAttachment() {
            if (!currentOpenTaskId) return;
            const fileInput = document.getElementById('newTaskAttachment');
            if (!fileInput.files[0]) return;

            const btn = document.getElementById('uploadAttachmentBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>'; btn.disabled = true;

            const formData = new FormData(); formData.append('file', fileInput.files[0]);
            fetch(`/api/tasks/${currentOpenTaskId}/attachments`, {
                method: 'POST', headers: {[CSRF_HEADER]: CSRF_TOKEN}, body: formData
            }).then(res => {
                btn.innerHTML = 'Завантажити'; btn.disabled = false;
                if (res.ok) { fileInput.value = ''; openTaskDetails(currentOpenTaskId); }
            });
        }
        /*]]>*/
    </script>
</th:block>
</body>
</html>
