<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Головна')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mt-4 mb-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
        <div>
            <h2 class="mb-0 text-dark fw-bold">👋 Вітаємо в ELS CRM</h2>
            <p class="text-muted mb-0">Короткий огляд поточного стану справ.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/transactions/new" class="btn btn-success shadow-sm fw-bold"><i class="bi bi-plus-lg me-1"></i> Транзакція</a>
            <a href="/projects/new" class="btn btn-primary shadow-sm fw-bold"><i class="bi bi-folder-plus me-1"></i> Проєкт</a>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
            <div class="card shadow-sm border-0 border-start border-4 border-success h-100" style="border-radius: 12px;">
                <div class="card-body p-3 p-md-4">
                    <div class="text-muted fw-bold text-uppercase mb-1" style="font-size: 0.75rem;">Загальний дохід</div>
                    <h4 class="text-success mb-0 fw-bold">+ <span th:text="${#numbers.formatDecimal(totalIncome, 1, 'WHITESPACE', 2, 'POINT')}"></span> ₴</h4>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card shadow-sm border-0 border-start border-4 border-danger h-100" style="border-radius: 12px;">
                <div class="card-body p-3 p-md-4">
                    <div class="text-muted fw-bold text-uppercase mb-1" style="font-size: 0.75rem;">Загальні витрати</div>
                    <h4 class="text-danger mb-0 fw-bold">- <span th:text="${#numbers.formatDecimal(totalExpense, 1, 'WHITESPACE', 2, 'POINT')}"></span> ₴</h4>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card shadow-sm border-0 border-start border-4 h-100" th:classappend="${totalBalance >= 0 ? 'border-success' : 'border-danger'}" style="border-radius: 12px;">
                <div class="card-body p-3 p-md-4">
                    <div class="text-muted fw-bold text-uppercase mb-1" style="font-size: 0.75rem;">Чистий баланс</div>
                    <h3 class="mb-0 fw-bold" th:classappend="${totalBalance >= 0 ? 'text-success' : 'text-danger'}">
                        <span th:text="${totalBalance > 0 ? '+' : ''}"></span><span th:text="${#numbers.formatDecimal(totalBalance, 1, 'WHITESPACE', 2, 'POINT')}"></span> ₴
                    </h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-xl-6">
            <div class="card shadow-sm border-0 h-100" style="border-radius: 12px;">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-2 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-folder-symlink me-2 text-primary"></i>Останні активні проєкти</h5>
                    <a href="/projects" class="btn btn-sm btn-outline-secondary">Всі проєкти</a>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush mt-2">
                        <li th:each="p : ${activeProjects}" class="list-group-item px-4 py-3 border-light d-flex justify-content-between align-items-center">
                            <div class="text-truncate pe-3">
                                <a th:href="@{/projects/{id}(id=${p.id()})}" class="fw-bold text-dark text-decoration-none d-block text-truncate mb-1" th:text="${p.name()}"></a>
                                <small class="text-muted"><i class="bi bi-geo-alt me-1 text-danger"></i><span th:text="${p.addressText()}"></span></small>
                            </div>
                            <span class="badge bg-success bg-opacity-10 text-success text-nowrap rounded-pill">Активний</span>
                        </li>
                        <li th:if="${#lists.isEmpty(activeProjects)}" class="list-group-item px-4 py-4 text-center text-muted border-light">
                            Немає активних проєктів.
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-12 col-xl-6">
            <div class="card shadow-sm border-0 h-100" style="border-radius: 12px;">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-2 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-receipt me-2 text-warning"></i>Останні транзакції</h5>
                    <a href="/transactions" class="btn btn-sm btn-outline-secondary">Всі транзакції</a>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush mt-2">
                        <li th:each="t : ${recentTransactions}" class="list-group-item px-4 py-3 border-light d-flex justify-content-between align-items-center">
                            <div class="text-truncate pe-3">
                                <strong class="text-dark d-block text-truncate mb-1" th:text="${t.projectName()}"></strong>
                                <small class="text-muted">
                                    <span th:text="${#temporals.format(t.date(), 'dd MMM yy')}"></span> •
                                    <span th:text="${t.category().getUkrainianName()}"></span>
                                </small>
                            </div>
                            <div class="text-end fw-bold text-nowrap" th:classappend="${t.type().name() == 'INCOME'} ? 'text-success' : 'text-danger'">
                                <span th:text="${t.type().name() == 'EXPENSE'} ? '-' : '+'"></span>
                                <span th:text="${t.amount()}"></span> ₴
                            </div>
                        </li>
                        <li th:if="${#lists.isEmpty(recentTransactions)}" class="list-group-item px-4 py-4 text-center text-muted border-light">
                            Немає останніх транзакцій.
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
