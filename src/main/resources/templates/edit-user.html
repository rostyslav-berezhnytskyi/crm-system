<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">

    <div class="card shadow">
        <div class="card-header bg-dark text-white d-flex justify-content-between">
            <h4 class="mb-0">Edit Employee: <span th:text="${user.username}"></span></h4>
            <a href="/users" class="btn btn-sm btn-outline-light">Back</a>
        </div>
        <div class="card-body">

            <form th:action="@{/users/edit/{id}(id=${user.id})}" method="post" enctype="multipart/form-data">

                <div class="mb-3">
                    <label>Profile Photo</label>
                    <input type="file" name="photo" class="form-control" accept="image/*">
                    <small class="text-muted" th:if="${user.photoUrl != null}">
                        Current photo: <span th:text="${user.photoUrl}"></span>
                    </small>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Username</label>
                        <input type="text" name="username" class="form-control" th:value="${user.username}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" th:value="${user.email}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Phone Number</label>
                        <input type="text" name="phoneNumber" class="form-control" th:value="${user.phoneNumber}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Telegram ID</label>
                        <input type="text" name="telegramId" class="form-control" th:value="${user.telegramId}">
                    </div>
                </div>

                <hr>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>System Role</label>
                        <select name="role" class="form-select" required>
                            <option th:each="r : ${roles}"
                                    th:value="${r.name()}"
                                    th:text="${r.name()}"
                                    th:selected="${r == user.role}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3 d-flex align-items-end">
                        <div class="form-check form-switch mb-2">
                            <input type="hidden" name="_enabled" value="on">
                            <input class="form-check-input" type="checkbox" name="enabled" value="true" th:checked="${user.enabled}">
                            <label class="form-check-label text-danger fw-bold">Account Active</label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label>Reset Password <span class="text-muted">(Optional)</span></label>
                    <input type="password" name="newPassword" class="form-control" autocomplete="new-password" placeholder="Leave blank to keep current password">
                </div>

                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </form>

        </div>
    </div>
</div>
</body>
</html>
