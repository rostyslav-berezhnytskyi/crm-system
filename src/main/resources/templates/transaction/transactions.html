<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ELS CRM - Транзакції</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        body { background-color: #f4f6f9; }
        .table-card { border-radius: 12px; overflow: hidden; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .type-badge { font-size: 0.8rem; padding: 5px 10px; border-radius: 20px; }
        .amount-income { color: #198754; font-weight: bold; }
        .amount-expense { color: #dc3545; font-weight: bold; }

        .col-date { width: 120px; white-space: nowrap; }
        .col-project { width: 15%; }
        .col-category { width: 10%; }
        .col-type { width: 100px; text-align: center; }
        .col-amount { width: 130px; text-align: right; }
        .col-files { width: 90px; text-align: center; }
        .col-actions { width: 100px; text-align: center; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/static">ELS CRM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/projects">Проєкти</a></li>
                <li class="nav-item"><a class="nav-link active" href="/transactions">Транзакції</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacts">Контакти</a></li>
                <li class="nav-item"><a class="nav-link" href="/companies">Компанії</a></li>
                <li class="nav-item"><a class="nav-link" href="/users">Співробітники</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Вийти
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>💰 Транзакції</h2>
        <a href="/transactions/new" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Нова транзакція
        </a>
    </div>

    <div class="card table-card">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="col-date">Дата</th>
                    <th class="col-project">Проєкт</th>
                    <th>Опис</th>
                    <th class="col-category">Категорія</th>
                    <th class="col-type">Тип</th>
                    <th class="col-amount">Сума</th>
                    <th class="col-files">Файли</th>
                    <th class="col-actions">Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${transactions}">
                    <td th:text="${#temporals.format(t.date, 'dd MMM yyyy')}">Дата</td>
                    <td><strong th:text="${t.projectName}">Назва проєкту</strong></td>
                    <td th:text="${t.description}"> Купили кабелі </td>
                    <td th:text="${t.category.ukrainianName}">Категорія</td>
                    <td class="text-center">
                        <span th:if="${t.type.name() == 'INCOME'}" class="badge bg-success bg-opacity-10 text-success type-badge">ДОХІД</span>
                        <span th:if="${t.type.name() == 'EXPENSE'}" class="badge bg-danger bg-opacity-10 text-danger type-badge">ВИТРАТА</span>
                    </td>
                    <td class="text-end" th:classappend="${t.type.name() == 'INCOME'} ? 'amount-income' : 'amount-expense'">
                        <div>
                            <span th:text="${t.type.name() == 'EXPENSE'} ? '-' : '+'"></span>
                            <span th:text="${t.amount}">0.00</span> ₴
                        </div>
                        <div class="small text-muted fw-normal" style="font-size: 0.75rem;">
                            <i class="bi bi-wallet2"></i> <span th:text="${t.paymentMethod.ukrainianName}">ГОТІВКА</span>
                        </div>
                    </td>
                    <td class="text-center">
                        <a th:if="${t.receiptUrl}" th:href="@{'/uploads/' + ${t.receiptUrl}}" target="_blank" class="btn btn-sm btn-outline-secondary border-0" title="Переглянути чек">
                            <i class="bi bi-file-earmark-text fs-5"></i>
                        </a>
                        <a th:if="${t.itemImageUrl}" th:href="@{'/uploads/' + ${t.itemImageUrl}}" target="_blank" class="btn btn-sm btn-outline-info border-0" title="Переглянути фото товару">
                            <i class="bi bi-camera fs-5"></i>
                        </a>
                    </td>
                    <td class="text-center">
                        <div class="btn-group">
                            <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/transactions/edit/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary border-0" title="Редагувати">
                                <i class="bi bi-pencil-square fs-5"></i>
                            </a>
                            <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/transactions/delete/{id}(id=${t.id})}" onclick="return confirm('Видалити цю транзакцію?')" class="btn btn-sm btn-outline-danger border-0" title="Видалити">
                                <i class="bi bi-x-square fs-5"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="8" class="text-center py-4 text-muted">
                        Транзакції не знайдено. <a href="/transactions/new">Створіть першу зараз!</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
