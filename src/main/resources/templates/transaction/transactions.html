<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ELS CRM - Транзакції')}"></head>

<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid px-3 px-md-4 mb-5">

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
        <h2 class="mb-0 text-center text-sm-start">💰 Транзакції</h2>
        <div class="w-100 d-flex justify-content-center justify-content-sm-end">
            <a href="/transactions/new" class="btn btn-primary text-nowrap w-100 w-sm-auto shadow-sm" style="max-width: 420px;">
                <i class="bi bi-plus-lg"></i> Нова транзакція
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0 d-none d-lg-block mb-4">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0" style="table-layout: fixed; width: 100%;">
                <thead class="table-light">
                <tr>
                    <th style="width: 100px;">Дата</th>
                    <th style="width: 15%;">Проєкт</th>
                    <th style="width: 15%;">Постачальник</th>
                    <th>Опис</th>
                    <th style="width: 12%;">Категорія</th>
                    <th style="width: 100px;" class="text-center">Тип</th>
                    <th style="width: 130px;" class="text-end pe-3">Сума</th>
                    <th style="width: 90px;" class="text-center">Файли</th>
                    <th style="width: 100px;" class="text-center">Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${transactions}">
                    <td class="text-muted small" th:text="${#temporals.format(t.date, 'dd MMM yy')}"></td>

                    <td class="text-truncate" th:title="${t.projectName}">
                        <strong th:text="${t.projectName}"></strong>
                    </td>

                    <td>
                        <a th:if="${t.sellerName != null}" th:href="${t.sellerUrl}" class="fw-bold text-decoration-none text-primary small text-truncate d-block" th:title="${t.sellerName}" th:text="${t.sellerName}"></a>
                        <span th:if="${t.sellerName == null}" class="text-muted small">—</span>
                    </td>

                    <td>
                        <div class="text-muted"
                             style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer;"
                             th:data-desc="${t.description}"
                             onclick="showNoteModal(this.getAttribute('data-desc'))"
                             title="Натисніть, щоб прочитати повністю">
                            <span th:text="${t.description}"></span>
                        </div>
                    </td>

                    <td th:text="${t.category.ukrainianName}"></td>

                    <td class="text-center">
                        <span th:if="${t.type.name() == 'INCOME'}" class="badge bg-success bg-opacity-10 text-success type-badge">ДОХІД</span>
                        <span th:if="${t.type.name() == 'EXPENSE'}" class="badge bg-danger bg-opacity-10 text-danger type-badge">ВИТРАТА</span>
                    </td>

                    <td class="text-end pe-3" th:classappend="${t.type.name() == 'INCOME'} ? 'text-success fw-bold' : 'text-danger fw-bold'">
                        <div>
                            <span th:text="${t.type.name() == 'EXPENSE'} ? '-' : '+'"></span>
                            <span th:text="${t.amount}">0.00</span> ₴
                        </div>
                        <div class="small text-muted fw-normal" style="font-size: 0.75rem;">
                            <i class="bi bi-wallet2"></i> <span th:text="${t.paymentMethod.ukrainianName}">ГОТІВКА</span>
                        </div>
                    </td>

                    <td class="text-center">
                        <a th:if="${t.receiptUrl}" th:href="@{'/uploads/' + ${t.receiptUrl}}" target="_blank" class="btn btn-sm btn-outline-secondary border-0" title="Переглянути чек"><i class="bi bi-file-earmark-text fs-5"></i></a>
                        <a th:if="${t.itemImageUrl}" th:href="@{'/uploads/' + ${t.itemImageUrl}}" target="_blank" class="btn btn-sm btn-outline-info border-0" title="Переглянути фото товару"><i class="bi bi-camera fs-5"></i></a>
                    </td>

                    <td class="text-center">
                        <div class="btn-group">
                            <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/transactions/edit/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary border-0" title="Редагувати"><i class="bi bi-pencil-square fs-5"></i></a>
                            <form th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:action="@{/transactions/delete/{id}(id=${t.id})}" method="post" onsubmit="return confirm('Видалити цю транзакцію?');" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="Видалити"><i class="bi bi-x-square fs-5"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="9" class="text-center py-4 text-muted">Транзакції не знайдено.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-lg-none mb-4 d-flex justify-content-center">
        <div class="w-100 px-2" style="max-width: 420px;">

            <div th:each="t : ${transactions}" class="card shadow-sm border-0 mb-3" style="border-radius: 16px;">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <strong class="text-dark d-block text-truncate pe-2" th:text="${t.projectName}"></strong>
                        <span th:if="${t.type.name() == 'INCOME'}" class="badge bg-success bg-opacity-10 text-success text-nowrap">ДОХІД</span>
                        <span th:if="${t.type.name() == 'EXPENSE'}" class="badge bg-danger bg-opacity-10 text-danger text-nowrap">ВИТРАТА</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted small"><i class="bi bi-calendar3"></i> <span th:text="${#temporals.format(t.date, 'dd MMM yyyy')}"></span></span>
                        <div class="text-end" th:classappend="${t.type.name() == 'INCOME'} ? 'text-success fw-bold' : 'text-danger fw-bold'">
                            <span th:text="${t.type.name() == 'EXPENSE'} ? '-' : '+'"></span>
                            <span th:text="${t.amount}"></span> ₴
                        </div>
                    </div>

                    <div class="bg-light p-2 rounded mb-3" style="cursor: pointer;" th:data-desc="${t.description}" onclick="showNoteModal(this.getAttribute('data-desc'))">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2">
                            <span class="badge bg-secondary" th:text="${t.category.ukrainianName}"></span>
                            <div th:if="${t.sellerName != null}" class="d-flex align-items-center text-truncate" style="max-width: 180px;">
                                <i class="bi bi-shop text-muted me-2 small"></i>
                                <a th:href="${t.sellerUrl}" class="fw-bold text-decoration-none text-primary small text-truncate" th:title="${t.sellerName}" th:text="${t.sellerName}"></a>
                            </div>
                        </div>
                        <p class="mb-0 text-muted small" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" th:text="${t.description}"></p>
                        <div class="text-primary small text-end mt-1">Читати далі...</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-2">
                        <div class="small text-muted"><i class="bi bi-wallet2"></i> <span th:text="${t.paymentMethod.ukrainianName}"></span></div>

                        <div class="btn-group">
                            <a th:if="${t.receiptUrl}" th:href="@{'/uploads/' + ${t.receiptUrl}}" target="_blank" class="btn btn-sm btn-outline-secondary border-0"><i class="bi bi-file-earmark-text fs-5"></i></a>
                            <a th:if="${t.itemImageUrl}" th:href="@{'/uploads/' + ${t.itemImageUrl}}" target="_blank" class="btn btn-sm btn-outline-info border-0"><i class="bi bi-camera fs-5"></i></a>
                            <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/transactions/edit/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary border-0"><i class="bi bi-pencil-square fs-5"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(transactions)}" class="text-center py-4 text-muted">Транзакції не знайдено.</div>
        </div>
    </div>

    <nav aria-label="Page navigation" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/transactions(page=${currentPage - 1})}">Попередня</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                <a class="page-link" th:href="@{/transactions(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/transactions(page=${currentPage + 1})}">Наступна</a>
            </li>
        </ul>
    </nav>

</div>

<div class="modal fade" id="noteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-light">
                <h5 class="modal-title">📝 Опис транзакції</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="noteModalText" style="white-space: pre-wrap; font-size: 1.05rem;" class="mb-0 text-dark"></p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">Закрити</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showNoteModal(text) {
        document.getElementById('noteModalText').innerText = text;
        var myModal = new bootstrap.Modal(document.getElementById('noteModal'));
        myModal.show();
    }
</script>
</body>
</html>
