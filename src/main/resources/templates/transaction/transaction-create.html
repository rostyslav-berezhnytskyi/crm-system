<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ELS CRM - Нова транзакція</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>body { background-color: #f4f6f9; }</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/static">ELS CRM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/projects">Проєкти</a></li>
                <li class="nav-item"><a class="nav-link active" href="/transactions">Транзакції</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacts">Контакти</a></li>
                <li class="nav-item"><a class="nav-link" href="/companies">Компанії</a></li>
                <li class="nav-item"><a class="nav-link" href="/users">Співробітники</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Вийти
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">📝 Нова транзакція</h5>
                </div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger">
                        ⚠️ <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/transactions}" th:object="${transaction}" method="post" enctype="multipart/form-data">

                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label fw-bold">Проєкт</label>
                                <select th:field="*{projectId}" class="form-select" required>
                                    <option value="" disabled selected>-- Оберіть проєкт --</option>
                                    <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('projectId')}" th:errors="*{projectId}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Тип</label>
                                <select th:field="*{type}" class="form-select" required>
                                    <option th:each="t : ${types}" th:value="${t}" th:text="${t.ukrainianName}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Категорія</label>
                                <select th:field="*{category}" class="form-select" required>
                                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.ukrainianName}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Сума (₴)</label>
                                <input type="number" step="0.01" th:field="*{amount}" class="form-control" placeholder="0.00" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Спосіб оплати</label>
                                <select th:field="*{paymentMethod}" class="form-select" required>
                                    <option th:each="m : ${paymentMethods}" th:value="${m}" th:text="${m.ukrainianName}"></option>
                                </select>
                            </div>

                            <div class="col-md-12 mb-3">
                                <label class="form-label">Дата (Залиште порожнім для СЬОГОДНІ)</label>
                                <input type="datetime-local" th:field="*{date}" class="form-control">
                                <small class="text-muted">Якщо ви здійснили оплату раніше, виберіть правильну дату тут.</small>
                            </div>

                            <div class="col-md-12 mb-3">
                                <label class="form-label">Опис</label>
                                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="напр. Куплено 100м кабелю для підключення"></textarea>
                                <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">🧾 Чек / Рахунок (PDF/Фото)</label>
                                <input type="file" name="receiptFile" class="form-control" accept="image/*,.pdf">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">📸 Фото товару (Підтвердження)</label>
                                <input type="file" name="itemImageFile" class="form-control" accept="image/*">
                            </div>

                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/transactions" class="btn btn-secondary">Скасувати</a>
                            <button type="submit" class="btn btn-primary px-5">Зберегти транзакцію</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
